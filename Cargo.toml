[workspace]
resolver = "2"
members = [
    "vibecli/vibecli-cli",
    "vibecli/crates/vibe-sandbox",
    "vibecli/crates/vibe-sandbox-native",
    "vibecli/crates/vibe-sandbox-firecracker",
    "vibecli/crates/vibe-sandbox-hyperlight",
    "vibecli/crates/vibe-broker",
    "vibecoder/src-tauri",
    "vibecoder/crates/vibe-core",
    "vibecoder/crates/vibe-lsp",
    "vibecoder/crates/vibe-ai",
    "vibecoder/crates/vibe-infer",
    "vibecoder/crates/vibe-extensions",
    "vibecoder/crates/vibe-collab",
    "vibeaichat/src-tauri",
    "vibedesk/src-tauri",
    "crates/vibe-desktop-settings",
    "crates/vibe-desktop-voice",
    "crates/vibe-profile-store",
    "crates/vibe-embed",
    "crates/vibe-eval",
    "vibe-indexer",
    "vibe-memory",
    "kodegraph",
    "skilllensai-rs",
    "skilloptai-rs",
    "skillforgeai-rs",
    "fluxo/fluxo-core",
    "fluxo/fluxo-store",
    "fluxo/fluxo-engine",
    "fluxo/fluxo-server",
    "fluxo/fluxo-worker",
    "fluxo/fluxo-cli",
]

[workspace.package]
version = "0.5.8"
edition = "2021"
authors = ["Vibe Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }

# TUI
ratatui = "0.30"
crossterm = "0.29"

# HTTP client for LLM APIs
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Diff
similar = { version = "3.1", features = ["inline"] }

# Git
git2 = { version = "0.21.0", features = ["vendored-openssl"] }

# Syntax highlighting
# Only the bundled binary syntax/theme dumps are used (`load_defaults_newlines`
# / `ThemeSet::load_defaults`), never the YAML or plist loaders. Trimming the
# default feature set drops `yaml-rust`, unmaintained since 2024
# (RUSTSEC-2024-0320), along with the unused html + dump-create paths.
syntect = { version = "5.2", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# LSP
lsp-types = "0.97"
url = "2.5"

# Text processing
ropey = "1.6"

# File watching
notify = "8.2"

# Search
walkdir = "2"
regex = "1"

# Terminal
portable-pty = "0.9"

# Unique IDs
uuid = { version = "1", features = ["v4"] }

# HTTP server (daemon mode)
axum = "0.8"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "set-header"] }

# SQLite (session store)
rusqlite = { version = "0.40", features = ["bundled"] }

# Crypto (AWS SigV4 signing)
sha2 = "0.11"
hmac = "0.13"
p256 = { version = "0.14", features = ["ecdsa"] }
hex = "0.4"

# Code knowledge graph (kodegraph) — incremental AST-based symbol/edge graphs
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
petgraph = "0.8"

# mistral.rs (TuringWorks fork) pins candle to a git rev of 0.11.0 rather than
# the crates.io release. `vibe-infer` implements `mistralrs::core::KvCacheCodec`,
# whose methods take `candle_core::Tensor` — a registry candle and a git candle
# are *different crates* to cargo even at the same version, so the impl would
# not typecheck without forcing both onto one source. Keep this rev in lockstep
# with `Cargo.toml` in the fork; bump both together or the build breaks loudly.
[patch.crates-io]
candle-core = { git = "https://github.com/huggingface/candle.git", rev = "27f20fea993c81ea6d32ce44018f42b68466525e" }
candle-nn = { git = "https://github.com/huggingface/candle.git", rev = "27f20fea993c81ea6d32ce44018f42b68466525e" }
candle-transformers = { git = "https://github.com/huggingface/candle.git", rev = "27f20fea993c81ea6d32ce44018f42b68466525e" }
candle-metal-kernels = { git = "https://github.com/huggingface/candle.git", rev = "27f20fea993c81ea6d32ce44018f42b68466525e" }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# VibeCLI benefits from runtime speed over binary size
[profile.release.package.vibecli]
opt-level = 2
