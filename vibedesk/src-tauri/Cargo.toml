[package]
name = "vibedesk"
version.workspace = true
description = "VibeDesk — task-first, conversation-driven companion app"
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "vibedesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embeds the built frontend in the binary. Without it `generate_context!` stores
# no assets and the window is pointed at `devUrl` instead, so the app opens on a
# blank white page with nothing on stdout, in the log, or on screen to say why.
#
# `tauri build` turns this on for you — it passes `--features
# tauri/custom-protocol` — which is why every shipped build is fine and only a
# bare `cargo build --release` is not. Deliberately **not** in `default`:
# embedding brotli-compresses the whole bundle during macro expansion, and with
# it on by default every `cargo check` of this crate would pay for that.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
futures = "0.3"
# Embed the CLI crate to reach the encrypted ProfileStore directly (provider
# keys / config / UI prefs) — the same store VibeCoder uses, so settings carry over.
vibecli_cli = { package = "vibecli", path = "../../vibecli/vibecli-cli" }
vibe-desktop-settings = { path = "../../crates/vibe-desktop-settings" }
# Voice input — the same daemon bridge every shell uses (crates/vibe-desktop-voice).
vibe-desktop-voice = { path = "../../crates/vibe-desktop-voice" }
# The daemon's token layout and the "is mine the live one" check. Shared so a
# shell cannot disagree with the daemon about where the credential lives.
vibe-daemon-token = { path = "../../crates/vibe-daemon-token" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
