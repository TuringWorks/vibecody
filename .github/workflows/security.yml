name: Security

# Runs on every PR + push to main, plus a weekly cron so newly-published CVEs
# against pinned deps are caught even with no code change. See
# docs/security/threat-model.md §7 for the rationale (top-20 ranks #4, #5, #13,
# #14, #15 all live here).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC — surface new RustSec/npm advisories at the start of the week.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # `security-events: write` needed if/when we upload SARIF to the Code Scanning tab.
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3

jobs:
  # ─── Rust supply-chain ─────────────────────────────────────────────────────
  cargo-audit:
    name: cargo audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache cargo registry + advisory-db
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/advisory-db
          key: cargo-audit-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-audit-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # DO NOT regenerate Cargo.lock here. It is committed, and regenerating it
      # re-resolves every dependency to the newest semver-compatible release —
      # so the audit passed against versions that were never shipped while the
      # committed lock carried unpatched ones. That is exactly how quinn-proto
      # 0.11.14 (RUSTSEC-2026-0222 et al.) sat in the lock with a green audit.
      # Audit the lockfile the build actually uses.
      - name: Verify Cargo.lock is committed and current
        run: |
          test -f Cargo.lock || { echo "::error::Cargo.lock is missing — it must be committed"; exit 1; }
          cargo metadata --locked --format-version 1 >/dev/null

      # deny.toml is authoritative — it is the only schema that carries a
      # reason and a review-by date per entry. cargo-deny cannot read
      # .cargo/audit.toml and cargo-audit cannot read deny.toml, so the id
      # sets have to be mirrored; this step is what stops them drifting,
      # which is how v0.5.8's release audit failed on an advisory that only
      # security.yml's copy carried.
      #
      # Extracts bare quoted ids from audit.toml's `ignore = [...]` array and
      # `id = "…"` fields from deny.toml's — deliberately line-shaped rather
      # than a TOML parse, so the step needs no toolchain. Both files keep one
      # id per line for exactly this reason; a reflowed array will fail here
      # rather than silently check nothing.
      - name: Suppression lists agree (.cargo/audit.toml ↔ deny.toml)
        run: |
          set -euo pipefail
          grep -oE '^\s*"RUSTSEC-[0-9]{4}-[0-9]{4}"' .cargo/audit.toml \
            | grep -oE 'RUSTSEC-[0-9]{4}-[0-9]{4}' | sort -u > /tmp/audit-ids
          grep -oE 'id = "RUSTSEC-[0-9]{4}-[0-9]{4}"' deny.toml \
            | grep -oE 'RUSTSEC-[0-9]{4}-[0-9]{4}' | sort -u > /tmp/deny-ids
          # An empty extraction means the format changed, not that the lists agree.
          test -s /tmp/audit-ids || { echo "::error::extracted no ids from .cargo/audit.toml"; exit 1; }
          test -s /tmp/deny-ids  || { echo "::error::extracted no ids from deny.toml"; exit 1; }
          if ! diff -u /tmp/deny-ids /tmp/audit-ids; then
            echo "::error::.cargo/audit.toml and deny.toml suppression lists disagree (- deny.toml, + audit.toml). Edit deny.toml first, then mirror the id into .cargo/audit.toml."
            exit 1
          fi
          echo "suppression lists agree ($(wc -l < /tmp/deny-ids) advisories)"

      # No `|| true` — this MUST fail the build on any unpatched advisory.
      # Suppressions come from .cargo/audit.toml, which cargo-audit reads
      # automatically from the repo root; the step above pins it to deny.toml.
      - name: Run cargo audit
        run: cargo audit --deny warnings

  # ─── Rust policy (licenses, sources, banned crates, duplicates) ────────────
  cargo-deny:
    name: cargo deny (licenses, sources, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Install cargo-deny
        # v2.0.4 → v2.0.18: v2.0.5 added Cargo 1.85 / edition2024 support
        # via tame-index 0.18.0 (release notes). Stuck on v2.0.4 made
        # the job fail on any transitive dep that declared
        # `edition = "2024"` — globset 0.4.18 in this repo, since 2026-04-xx.
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check
          arguments: --all-features

  # ─── Frontend supply-chain (npm) ────────────────────────────────────────────
  npm-audit:
    name: npm audit (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # EVERY directory with a package.json belongs here. vibedesk and
        # vscode-extension were missing, and vscode-extension alone was
        # carrying 8 high-severity advisories that nothing ever reported.
        path: [vibecoder, vibeaichat, vibedesk, packages/agent-sdk, vscode-extension]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Skip if no package.json
        id: precheck
        run: |
          if [ -f "${{ matrix.path }}/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json at ${{ matrix.path }} — skipping"
          fi

      # DO NOT regenerate the lockfile. package-lock.json is committed now
      # (see .gitignore) and regenerating re-resolves to the newest
      # semver-compatible releases, so the audit graded dependencies nobody
      # installs. While these were regenerated, agent-sdk's committed state
      # pinned vitest 1.6.1 with a critical advisory and CI audited 4.x.
      - name: Verify lockfile is committed
        if: steps.precheck.outputs.exists == 'true'
        working-directory: ${{ matrix.path }}
        run: test -f package-lock.json || { echo "::error::${{ matrix.path }}/package-lock.json is missing — it must be committed"; exit 1; }

      # Two tiers, because severity alone is a bad proxy for risk here.
      #
      # Production deps at MODERATE: dompurify shipped 17 open sanitizer-bypass
      # advisories in vibecoder — every one rated moderate, on a runtime dep
      # that sanitizes attacker-controlled EPUB HTML. A `high` threshold is
      # blind to precisely the class of bug that matters most in a renderer.
      #
      # Dev deps at HIGH: build tooling churns and a moderate there is rarely
      # shipped risk. Holding dev deps to moderate would keep this job red,
      # and a permanently-red security job is one nobody reads.
      - name: Run npm audit (production deps, moderate+)
        if: steps.precheck.outputs.exists == 'true'
        working-directory: ${{ matrix.path }}
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run npm audit (all deps incl. dev, high+)
        if: steps.precheck.outputs.exists == 'true'
        working-directory: ${{ matrix.path }}
        run: npm audit --audit-level=high

  # ─── Python supply-chain (vibe-rl-py) ──────────────────────────────────────
  # vibe-rl-py uses uv.lock — outside the npm/cargo coverage above. pip-audit
  # reads the lockfile (via `uv export`) and checks PyPI/OSV advisories.
  pip-audit:
    name: pip-audit (vibe-rl-py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        # TODO: pin to verified SHA during Phase 3 hardening (consistent with
        # the rest of this workflow's pin policy).
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv + pip-audit
        run: pip install --upgrade uv pip-audit

      - name: Export uv.lock → requirements.txt
        working-directory: vibe-rl-py
        # `--no-emit-project` drops the `-e .` editable self-reference (pip-audit
        # can't hash-install a local path). `--no-hashes` sidesteps a uv↔pip
        # hash-format mismatch where uv records sdist hashes that pip's
        # --require-hashes dry-run pass then rejects.
        run: uv export --frozen --no-emit-project --no-hashes --format requirements-txt --output-file /tmp/vibe-rl-py-requirements.txt

      # Each `--ignore-vuln` suppression below MUST cite an audit. Treat the
      # list as a security debt log — review during quarterly threat-model
      # refresh per docs/security/threat-model.md.
      - name: Run pip-audit
        run: |
          # GHSA-69w3-r845-3855 / CVE-2026-1839 (transformers ≤5.0.0rc3):
          #   Vulnerability is in transformers.Trainer._load_rng_state().
          #   vibe-rl-py does not use Trainer (verified by grep across
          #   vibe_rl/algos/*.py; the .train() calls are nn.Module.train()).
          #   Dismissed in Dependabot alert #9. Re-evaluate when upgrading
          #   to transformers 5.x (currently pinned <5.0 in pyproject.toml).
          #
          # PYSEC-2025-189 .. 197, 210, PYSEC-2026-139, and CVE-2025-3000
          # (torch 2.11.0):
          #   Pre-existing torch CVEs surfaced 2026-05-20 when the Security
          #   workflow started actually running (see commit 6ab99683
          #   notes). No upstream fix has been published for any of these
          #   advisories at triage time; the `Fix Versions` column in
          #   pip-audit output is empty for all of them. vibe-rl-py uses
          #   torch only as an in-process RL training library (mappo /
          #   quantize / inference paths under vibe_rl/algos/*.py) — never
          #   as a network-facing deserialization sink. Threat-model
          #   applicability is low: the typical torch CVE involves
          #   pickle.load on adversary-controlled checkpoint bytes; our
          #   checkpoint loader (vibe_rl/checkpoint.py) reads from
          #   workspace-local files only. CVE-2025-3000 (torch.jit.script
          #   memory corruption, GHSA-rrmf-rvhw-rf47) was added 2026-06-13
          #   when pip-audit's DB began reporting it under its CVE id (the
          #   PYSEC-* ignores above don't alias it); same no-fix torch
          #   2.11.0 story, dismissed as Dependabot alert #16. Re-evaluate
          #   at quarterly review (2026-08-19) — bump torch when a release
          #   ships the fixes, or document each id individually with a
          #   tighter threat-model trace if any becomes exploitable.
          pip-audit \
            -r /tmp/vibe-rl-py-requirements.txt \
            --ignore-vuln GHSA-69w3-r845-3855 \
            --ignore-vuln CVE-2025-3000 \
            --ignore-vuln PYSEC-2025-189 \
            --ignore-vuln PYSEC-2025-190 \
            --ignore-vuln PYSEC-2025-191 \
            --ignore-vuln PYSEC-2025-192 \
            --ignore-vuln PYSEC-2025-193 \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2025-195 \
            --ignore-vuln PYSEC-2025-196 \
            --ignore-vuln PYSEC-2025-197 \
            --ignore-vuln PYSEC-2025-210 \
            --ignore-vuln PYSEC-2026-139

  # ─── Secret scanning ────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so gitleaks can scan past commits, not just the diff.
          # If the repo grows beyond ~5min scan time, switch to `fetch-depth: 1`
          # and rely on protected-branches + pre-commit hook for older history.
          fetch-depth: 0

      # Run gitleaks directly via Docker image (free, no license key required).
      # The gitleaks-action@v2 requires a paid GITLEAKS_LICENSE secret which
      # caused CI failures. Using the CLI directly achieves the same scan.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest             detect --source /repo --config /repo/.gitleaks.toml --no-git -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── SAST: VibeCody-specific patterns + OWASP Top 10 baseline ──────────────
  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    # TODO: pin image to a verified digest during Phase 3 hardening — see release.yml
    # for the SHA-pinning convention this repo follows for actions.
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Three rulesets:
      #   1. OWASP Top 10 baseline (registry)
      #   2. Rust + TypeScript + JavaScript security patterns
      #   3. VibeCody-local rules (added under .semgrep/ in a follow-up PR)
      #
      # `semgrep ci` exits non-zero on findings — that is the gate.
      - name: Run semgrep
        run: |
          semgrep ci \
            --config p/owasp-top-ten \
            --config p/rust \
            --config p/typescript \
            --config p/javascript \
            --config p/secrets \
            --sarif-output semgrep.sarif \
            ${{ hashFiles('.semgrep/*.yml') != '' && '--config .semgrep/' || '' }}
        env:
          SEMGREP_RULES_CACHE_DIR: /tmp/semgrep-cache

      # Upload SARIF results to GitHub Code Scanning for inline findings.
      # Requires security-events: write (already granted above).
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
        with:
          sarif_file: semgrep.sarif

  # ─── Aggregate gate ─────────────────────────────────────────────────────────
  # A single required check for branch protection — easier than listing every
  # job individually in repo settings.
  security-gate:
    name: Security gate (required)
    runs-on: ubuntu-latest
    needs: [cargo-audit, cargo-deny, npm-audit, pip-audit, gitleaks, semgrep]
    if: always()
    steps:
      - name: Aggregate result
        run: |
          if [[ "${{ needs.cargo-audit.result }}"  != "success" ]] || \
             [[ "${{ needs.cargo-deny.result }}"   != "success" ]] || \
             [[ "${{ needs.npm-audit.result }}"    != "success" ]] || \
             [[ "${{ needs.pip-audit.result }}"    != "success" ]] || \
             [[ "${{ needs.gitleaks.result }}"     != "success" ]] || \
             [[ "${{ needs.semgrep.result }}"      != "success" ]]; then
            echo "::error::One or more security checks failed. See individual job logs."
            exit 1
          fi
          echo "All security checks passed."
