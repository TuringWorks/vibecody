name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.9)"
        required: true
        # Deliberately no `default:`. This input is only read on a manual
        # dispatch, and a default is a one-click re-release of whatever was
        # current when the file was last touched — it sat at v0.5.5 for four
        # releases. Required with no default forces the tag to be typed.

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  FLUTTER_VERSION: "3.44.2"
  JAVA_VERSION: "17"

jobs:
  # ─── Security audit ───────────────────────────────────────────────────
  # Release-time gate. The broader per-PR security suite lives in
  # .github/workflows/security.yml (cargo-deny, npm audit, gitleaks, semgrep).
  # Here we keep a minimal blocking `cargo audit` so a tag push cannot ship
  # a binary built against a crate with a known RUSTSEC advisory.
  # See docs/security/threat-model.md §7 item #4.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # DO NOT regenerate Cargo.lock. It is committed (the old step name
      # called it gitignored; it is not, and has not been), and
      # `cargo generate-lockfile` re-resolves every dependency to the newest
      # semver-compatible release — so this gate passed against versions that
      # were never built, while the lock the release actually compiles from
      # kept its unpatched ones. That is exactly how quinn-proto 0.11.14
      # (RUSTSEC-2026-0222 et al.) sat in the lock behind a green audit.
      # security.yml stopped doing this; the release gate had not, which made
      # the stricter of the two audits the one that meant less.
      - name: Verify Cargo.lock is committed and current
        run: |
          test -f Cargo.lock || { echo "::error::Cargo.lock is missing — it must be committed"; exit 1; }
          cargo metadata --locked --format-version 1 >/dev/null

      # No `|| true`. Suppressions come from .cargo/audit.toml, which
      # cargo-audit reads automatically from the repo root — this used to be
      # a 29-flag `--ignore` list copy-pasted from security.yml, and the two
      # drifted: v0.5.8 failed here on RUSTSEC-2026-0215 because this copy
      # was the one missing it. deny.toml stays authoritative (it is the only
      # schema with a reason per entry); security.yml fails if the two
      # disagree.
      - name: Run cargo audit
        run: cargo audit --deny warnings

  # ─── Software Bill of Materials (SBOM, CycloneDX) ─────────────────────
  # Per-release attestation of the dependency tree across all three
  # ecosystems we ship. See docs/security/threat-model.md §7 item #14.
  # The .cdx.json artifacts ride along on the GitHub release so consumers
  # (and auditors) can cross-reference against published advisories at any
  # future date without re-running the build.
  sbom:
    name: Generate SBOMs (CycloneDX)
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Install cargo-sbom
        run: cargo install cargo-sbom --locked

      # Same reason as the audit job, and it bites harder here: an SBOM is an
      # attestation of what this release contains. Built from a regenerated
      # lockfile it describes a dependency set that was resolved on the runner
      # and never compiled into any artifact — so an auditor cross-referencing
      # it against a future advisory would clear (or blame) versions the
      # release never shipped.
      - name: Verify Cargo.lock is committed and current
        run: |
          test -f Cargo.lock || { echo "::error::Cargo.lock is missing — it must be committed"; exit 1; }
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Rust SBOM
        run: cargo sbom --output-format cyclone_dx_json_1_4 > vibecody-rust.cdx.json

      # TODO: pin to a verified SHA during Phase 3 hardening.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install cdxgen
        run: npm install -g @cyclonedx/cdxgen

      - name: JS SBOMs (vibecoder, vibeaichat, agent-sdk)
        run: |
          set -euo pipefail
          for dir in vibecoder vibeaichat packages/agent-sdk; do
            if [ -f "$dir/package.json" ]; then
              ( cd "$dir" && npm install --package-lock-only --ignore-scripts )
              out="$(basename "$dir")-js.cdx.json"
              cdxgen --type js --output "$out" -p "$dir"
              echo "wrote $out"
            else
              echo "skip $dir (no package.json)"
            fi
          done

      # TODO: pin to a verified SHA during Phase 3 hardening.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python SBOM (vibe-rl-py)
        # Same uv-export gotchas as the pip-audit job: --no-emit-project
        # drops the editable self-ref, --no-hashes works around the
        # uv↔pip hash-format mismatch under --require-hashes.
        run: |
          pip install --upgrade uv cyclonedx-bom
          (
            cd vibe-rl-py
            uv export --frozen --no-emit-project --no-hashes \
              --format requirements-txt --output-file /tmp/vibe-rl-py-requirements.txt
          )
          cyclonedx-py requirements \
            /tmp/vibe-rl-py-requirements.txt \
            -o vibe-rl-py.cdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: |
            vibecody-rust.cdx.json
            vibecoder-js.cdx.json
            vibeaichat-js.cdx.json
            agent-sdk-js.cdx.json
            vibe-rl-py.cdx.json
          if-no-files-found: error

  # ─── VibeCLI binary (5 platforms) ──────────────────────────────────────
  build-cli:
    name: CLI · ${{ matrix.target }}
    needs: audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: vibecli
            archive: vibecli-aarch64-apple-darwin.tar.gz

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: vibecli
            archive: vibecli-x86_64-apple-darwin.tar.gz

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: vibecli
            archive: vibecli-x86_64-linux.tar.gz

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: vibecli
            archive: vibecli-aarch64-linux.tar.gz
            use_cross: true

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: vibecli.exe
            archive: vibecli-x86_64-windows.zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux musl, native)
        if: contains(matrix.target, 'musl') && !matrix.use_cross
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools cmake perl

      - name: Install cross (cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          key: cli-${{ matrix.target }}

      # `--locked` closes the loop the audit job opens: that job now verifies
      # the committed Cargo.lock, and this one refuses to build against
      # anything else. Without it cargo silently *updates* the lock when it
      # cannot satisfy Cargo.toml, and the shipped binary quietly stops
      # matching the dependency set that was audited and published as the
      # SBOM. `cargo metadata --locked` already passes, so this fails only
      # when the lock is genuinely stale — which is when a release should
      # stop.
      - name: Build release binary
        run: >
          ${{ matrix.use_cross && 'cross' || 'cargo' }} build
          --release
          --locked
          --package vibecli
          --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          strip "$BINARY" 2>/dev/null || true
          ls -lh "$BINARY"

      # ── macOS codesigning (dual-mode, same contract as the Tauri jobs) ──────
      # The CLI tarballs shipped completely unsigned — not even ad-hoc — so
      # Gatekeeper on a fresh machine quarantines the binary and `spctl`
      # rejects it. Signing must happen after `strip`, which invalidates any
      # existing signature, and before `tar`.
      #
      # Without the cert secret this is a no-op with a visible notice rather
      # than a failure, so forks and PR builds still produce a usable binary.
      - name: Import Apple Developer ID certificate (macOS)
        id: cli-apple-cert
        if: runner.os == 'macOS'
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}   # optional — generated when unset
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12_BASE64:-}" ]; then
            echo "::notice::APPLE_CERT_P12_BASE64 not set — vibecli will be unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"
          CERT_PATH="$RUNNER_TEMP/cli-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/cli-signing.keychain-db"
          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Codesign binary (macOS)
        if: runner.os == 'macOS' && steps.cli-apple-cert.outputs.signed == 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          BINARY="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          # --options runtime is required for notarization; --timestamp keeps
          # the signature valid past certificate expiry.
          codesign --force --sign "$SIGNING_IDENTITY" --options runtime --timestamp "$BINARY"
          # Verify rather than trust the exit code: codesign can succeed and
          # still leave something Gatekeeper refuses. A tarball published as
          # "signed" that is actually ad-hoc is worse than an unsigned one.
          codesign --verify --strict --verbose=2 "$BINARY"
          if codesign -dv --verbose=4 "$BINARY" 2>&1 | grep -q 'Signature=adhoc'; then
            echo "::error::vibecli is still ad-hoc signed after codesign"
            exit 1
          fi
          codesign -dv --verbose=4 "$BINARY" 2>&1 | grep '^Authority=' | head -1

      # Signing is not enough on its own: Gatekeeper wants a notarization
      # ticket too. A bare Mach-O binary cannot be *stapled* (stapling only
      # works for .app/.dmg/.pkg), so the ticket lives on Apple's servers and
      # is fetched on first run. Submitting still matters — without a ticket at
      # all, a quarantined vibecli is refused outright.
      #
      # Notarization is submitted on the zip of the binary; the ticket is bound
      # to the code signature (cdhash), so the copy inside the tar.gz below is
      # the one that was notarized.
      - name: Notarize binary (macOS)
        if: runner.os == 'macOS' && steps.cli-apple-cert.outputs.signed == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${NOTARY_APPLE_ID:-}" ] || [ -z "${NOTARY_PASSWORD:-}" ] || [ -z "${NOTARY_TEAM_ID:-}" ]; then
            echo "::notice::Notarization credentials not set — vibecli is Developer ID signed but not notarized. Users on a quarantined download will need: xattr -d com.apple.quarantine vibecli"
            exit 0
          fi
          BINARY="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          ZIP="$RUNNER_TEMP/${{ matrix.artifact }}-notarize.zip"
          # ditto, not zip: it preserves the signature and extended attributes
          # that notarytool needs to see.
          /usr/bin/ditto -c -k --keepParent "$BINARY" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait --timeout 30m
          # `--wait` returns 0 for "Accepted" only; anything else is a failure
          # we want loud rather than a tarball that claims to be notarized.
          echo "notarized: $BINARY"

      - name: Package (Unix tar.gz)
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" "${{ matrix.artifact }}"

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = "target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          Compress-Archive -Path $src -DestinationPath "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  # ─── VibeCoder desktop app (Tauri) ────────────────────────────────────────
  build-vibecoder:
    name: VibeCoder · ${{ matrix.label }}
    needs: audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS-arm64
            args: --target aarch64-apple-darwin

          - os: macos-latest
            label: macOS-x64
            args: --target x86_64-apple-darwin

          - os: ubuntu-22.04
            label: Linux-x64
            args: ""

          # GitHub-hosted arm64 Linux runner (free for public repos).
          - os: ubuntu-22.04-arm
            label: Linux-arm64
            args: ""

          - os: windows-latest
            label: Windows-x64
            args: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.label == 'macOS-arm64' && 'aarch64-apple-darwin' || matrix.label == 'macOS-x64' && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: vibecoder
        run: npm install --no-audit --no-fund

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          key: vibecoder-${{ matrix.label }}
          workspaces: vibecoder/src-tauri

      # ── macOS codesigning (dual-mode) ────────────────────────────────────
      # If APPLE_CERT_P12_BASE64 is set, import the Developer ID cert into a
      # throwaway keychain so `tauri build` can sign with `APPLE_SIGNING_IDENTITY`.
      # When the secret is absent, this step is a no-op and the build falls back
      # to the ad-hoc signing identity ("-") declared in tauri.conf.json — that
      # avoids the macOS "is damaged" Gatekeeper error but still shows the
      # an ad-hoc build, which macOS kills on launch while quarantined until
      # the user runs `xattr -dr com.apple.quarantine` (see docs/release.md).
      - name: Import Apple Developer ID certificate (macOS)
        id: vibecoder-apple-cert
        if: runner.os == 'macOS'
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}   # optional — generated when unset
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12_BASE64:-}" ]; then
            echo "::notice::APPLE_CERT_P12_BASE64 not set — building ad-hoc. macOS KILLS an ad-hoc hardened-runtime app while quarantined (exit 137, shows as 'is damaged'); right-click → Open does NOT reliably fix it. Users must run: xattr -dr com.apple.quarantine /Applications/<App>.app"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The keychain is created, used, and discarded inside this job, so
          # its password protects nothing that outlives the runner. Generating
          # one when the secret is unset removes a required secret — and with
          # it the silent failure where an empty password makes `security`
          # behave differently than intended.
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        working-directory: vibecoder
        env:
          # Passed as S_* and exported conditionally below. They cannot be set
          # as `env:` keys: GitHub Actions defines the key even when the
          # expression evaluates to '', and Tauri treats a present-but-empty
          # Apple variable as an explicit request. An empty
          # APPLE_SIGNING_IDENTITY became `codesign -s ""` ("no identity
          # found"); with that fixed, empty APPLE_ID/APPLE_TEAM_ID/APPLE_PASSWORD
          # became a notarization attempt dying with "Team ID must be at least 3
          # characters". Both failed the v0.5.8 macOS builds, one after the other.
          #
          # Unset is the only value meaning "don't": with none exported, Tauri
          # logs "skipping app notarization" and ad-hoc signs — the documented
          # unsigned path, and what a local build without these does.
          CERT_SIGNED: ${{ steps.vibecoder-apple-cert.outputs.signed }}
          S_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          S_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ "$CERT_SIGNED" = "true" ]; then
              export APPLE_SIGNING_IDENTITY="$S_IDENTITY"
              export APPLE_ID="$S_APPLE_ID"
              export APPLE_TEAM_ID="$S_TEAM_ID"
              export APPLE_PASSWORD="$S_PASSWORD"
            else
              # Ad-hoc sign; every notarization variable stays unset.
              export APPLE_SIGNING_IDENTITY="-"
            fi
          fi
          npx tauri build ${{ matrix.args }}
        # bash, not the Windows default PowerShell: the conditional export
        # block above is POSIX shell. Without this, Windows runners parse it
        # as a .ps1 and fail with ParserError before tauri ever runs.
        shell: bash

      # A signed build that silently fell back to ad-hoc is the exact failure
      # that shipped v0.5.7 and v0.5.8: the job goes green, the artifact
      # uploads, and macOS kills it on every user's machine. build-cli has
      # guarded against this since it was written; the app bundles did not.
      # Only meaningful when a certificate was actually imported — without one
      # ad-hoc is the intended outcome, not a regression.
      - name: Verify the bundle is not ad-hoc signed (macOS)
        if: runner.os == 'macOS' && steps.vibecoder-apple-cert.outputs.signed == 'true'
        run: |
          set -euo pipefail
          # Workspace-root target/, not vibecoder/src-tauri/target: every
          # src-tauri crate is a member of the root Cargo workspace, so bundles
          # land in <repo>/target/ — which is why "Collect artifacts" below has
          # always searched `target`. `|| true` keeps an empty result reportable:
          # under `set -euo pipefail` the failing find aborted the step before
          # its own error message, so the job failed with an empty log.
          APP_DIR=$(find target -name "*.app" -type d 2>/dev/null | head -1 || true)
          if [ -z "$APP_DIR" ]; then
            echo "::error::no .app bundle found to verify"; exit 1
          fi
          echo "verifying $APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          if codesign -dv --verbose=4 "$APP_DIR" 2>&1 | grep -q 'Signature=adhoc'; then
            echo "::error::$APP_DIR is ad-hoc signed despite a certificate being imported — refusing to publish"
            exit 1
          fi
          codesign -dv --verbose=2 "$APP_DIR" 2>&1 | grep -E 'Authority|TeamIdentifier' || true

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find target -name "*.dmg" -exec cp {} dist/ \; 2>/dev/null || true
          find target -name "*.deb" -exec cp {} dist/ \; 2>/dev/null || true
          find target -name "*.AppImage" -exec cp {} dist/ \; 2>/dev/null || true
          find target -name "*.msi" -exec cp {} dist/ \; 2>/dev/null || true
          find target -path "*/nsis/*.exe" -exec cp {} dist/ \; 2>/dev/null || true
          APP_DIR=$(find target -name "VibeCoder.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP_DIR" ]; then
            cd "$(dirname "$APP_DIR")" && zip -r "$GITHUB_WORKSPACE/dist/VibeCoder-${{ matrix.label }}.app.zip" "VibeCoder.app"
          fi
          ls -lhR dist/ || echo "dist/ is empty"
        shell: bash

      - name: Upload VibeCoder artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibecoder-${{ matrix.label }}
          path: dist/*

  # ─── VibeCLI desktop app (Tauri) ───────────────────────────────────────
  build-vibeaichat:
    name: VibeAIChat · ${{ matrix.label }}
    needs: audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS-arm64
            args: --target aarch64-apple-darwin

          - os: macos-latest
            label: macOS-x64
            args: --target x86_64-apple-darwin

          - os: ubuntu-22.04
            label: Linux-x64
            args: ""

          # GitHub-hosted arm64 Linux runner (free for public repos).
          - os: ubuntu-22.04-arm
            label: Linux-arm64
            args: ""

          - os: windows-latest
            label: Windows-x64
            args: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.label == 'macOS-arm64' && 'aarch64-apple-darwin' || matrix.label == 'macOS-x64' && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: vibeaichat
        run: npm install --no-audit --no-fund

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          key: vibeaichat-${{ matrix.label }}
          workspaces: vibeaichat/src-tauri

      # ── macOS codesigning (dual-mode) — see build-vibecoder for full rationale.
      - name: Import Apple Developer ID certificate (macOS)
        id: vibeaichat-apple-cert
        if: runner.os == 'macOS'
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}   # optional — generated when unset
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12_BASE64:-}" ]; then
            echo "::notice::APPLE_CERT_P12_BASE64 not set — building ad-hoc. macOS KILLS an ad-hoc hardened-runtime app while quarantined (exit 137, shows as 'is damaged'); right-click → Open does NOT reliably fix it. Users must run: xattr -dr com.apple.quarantine /Applications/<App>.app"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The keychain is created, used, and discarded inside this job, so
          # its password protects nothing that outlives the runner. Generating
          # one when the secret is unset removes a required secret — and with
          # it the silent failure where an empty password makes `security`
          # behave differently than intended.
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        working-directory: vibeaichat
        env:
          # Passed as S_* and exported conditionally below. They cannot be set
          # as `env:` keys: GitHub Actions defines the key even when the
          # expression evaluates to '', and Tauri treats a present-but-empty
          # Apple variable as an explicit request. An empty
          # APPLE_SIGNING_IDENTITY became `codesign -s ""` ("no identity
          # found"); with that fixed, empty APPLE_ID/APPLE_TEAM_ID/APPLE_PASSWORD
          # became a notarization attempt dying with "Team ID must be at least 3
          # characters". Both failed the v0.5.8 macOS builds, one after the other.
          #
          # Unset is the only value meaning "don't": with none exported, Tauri
          # logs "skipping app notarization" and ad-hoc signs — the documented
          # unsigned path, and what a local build without these does.
          CERT_SIGNED: ${{ steps.vibeaichat-apple-cert.outputs.signed }}
          S_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          S_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ "$CERT_SIGNED" = "true" ]; then
              export APPLE_SIGNING_IDENTITY="$S_IDENTITY"
              export APPLE_ID="$S_APPLE_ID"
              export APPLE_TEAM_ID="$S_TEAM_ID"
              export APPLE_PASSWORD="$S_PASSWORD"
            else
              # Ad-hoc sign; every notarization variable stays unset.
              export APPLE_SIGNING_IDENTITY="-"
            fi
          fi
          npx tauri build ${{ matrix.args }}
        # bash, not the Windows default PowerShell: the conditional export
        # block above is POSIX shell. Without this, Windows runners parse it
        # as a .ps1 and fail with ParserError before tauri ever runs.
        shell: bash

      # A signed build that silently fell back to ad-hoc is the exact failure
      # that shipped v0.5.7 and v0.5.8: the job goes green, the artifact
      # uploads, and macOS kills it on every user's machine. build-cli has
      # guarded against this since it was written; the app bundles did not.
      # Only meaningful when a certificate was actually imported — without one
      # ad-hoc is the intended outcome, not a regression.
      - name: Verify the bundle is not ad-hoc signed (macOS)
        if: runner.os == 'macOS' && steps.vibeaichat-apple-cert.outputs.signed == 'true'
        run: |
          set -euo pipefail
          # Workspace-root target/ — see build-vibecoder for the full rationale.
          APP_DIR=$(find target -name "*.app" -type d 2>/dev/null | head -1 || true)
          if [ -z "$APP_DIR" ]; then
            echo "::error::no .app bundle found to verify"; exit 1
          fi
          echo "verifying $APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          if codesign -dv --verbose=4 "$APP_DIR" 2>&1 | grep -q 'Signature=adhoc'; then
            echo "::error::$APP_DIR is ad-hoc signed despite a certificate being imported — refusing to publish"
            exit 1
          fi
          codesign -dv --verbose=2 "$APP_DIR" 2>&1 | grep -E 'Authority|TeamIdentifier' || true

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find target -name "*.dmg" -exec cp {} dist/ \; 2>/dev/null || true
          find target -name "*.deb" -exec cp {} dist/ \; 2>/dev/null || true
          find target -name "*.AppImage" -exec cp {} dist/ \; 2>/dev/null || true
          find target -name "*.msi" -exec cp {} dist/ \; 2>/dev/null || true
          find target -path "*/nsis/*.exe" -exec cp {} dist/ \; 2>/dev/null || true
          ls -lhR dist/ || echo "dist/ is empty"
        shell: bash

      - name: Upload VibeAIChat artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibeaichat-${{ matrix.label }}
          path: dist/*

  # ─── VibeDesk — task-first desktop shell ──────────────────────────────
  # Mirrors build-vibeaichat. VibeDesk's src-tauri embeds the whole `vibecli` crate
  # for direct ProfileStore access, exactly as build-vibecoder does, so expect
