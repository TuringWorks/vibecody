  # ─── VibeCody Mobile — Android (APK + AAB) ────────────────────────────
  build-android:
    name: Mobile · Android
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: vibemobile
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: vibemobile
        run: flutter test

      - name: Build Android APK (fat / universal)
        working-directory: vibemobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Android App Bundle (AAB)
        working-directory: vibemobile
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Collect Android artifacts
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          cp vibemobile/build/app/outputs/flutter-apk/app-release.apk \
             "dist/VibeCody-Mobile-${TAG}-android.apk"
          cp vibemobile/build/app/outputs/bundle/release/app-release.aab \
             "dist/VibeCody-Mobile-${TAG}-android.aab"
          ls -lh dist/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibemobile-android
          path: dist/*

  # ─── VibeCody Mobile — iOS (IPA) ──────────────────────────────────────
  build-ios:
    name: Mobile · iOS
    needs: audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin Xcode 26 — iOS 26 SDK is the required build SDK from April 28, 2026.
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1.7.0
        with:
          xcode-version: ^26.0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: vibemobile
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: vibemobile/ios
        run: pod install --repo-update || true

      # Signed iOS builds need an Apple Distribution certificate and a
      # provisioning profile. Both absent is the normal open-source case, and
      # the unsigned .ipa (sideloadable via AltStore/Sideloadly) still ships —
      # so this gates rather than fails.
      - name: Check iOS signing credentials
        id: ios-secrets
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DIST_CERT: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          IOS_PROFILE: ${{ secrets.APPLE_IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "${TEAM_ID:-}"     ] || MISSING="$MISSING APPLE_TEAM_ID"
          [ -n "${DIST_CERT:-}"   ] || MISSING="$MISSING APPLE_DIST_CERT_P12_BASE64"
          [ -n "${IOS_PROFILE:-}" ] || MISSING="$MISSING APPLE_IOS_PROFILE_BASE64"
          if [ -n "$MISSING" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Building an UNSIGNED iOS .ipa — missing secret(s):$MISSING"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple Distribution certificate (iOS)
        if: steps.ios-secrets.outputs.signed == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}   # optional
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"
          CERT_PATH="$RUNNER_TEMP/ios-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')

      - name: Install iOS provisioning profile
        if: steps.ios-secrets.outputs.signed == 'true'
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$PROFILE_DIR/VibeCodyMobile.mobileprovision"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          PLIST=$(security cms -D -i "$PROFILE_PATH")
          UUID=$(printf '%s' "$PLIST" | plutil -extract UUID raw -)
          NAME=$(printf '%s' "$PLIST" | plutil -extract Name raw -)
          echo "IOS_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "installed profile '$NAME' ($UUID)"

      - name: Build iOS (signed)
        if: steps.ios-secrets.outputs.signed == 'true'
        working-directory: vibemobile
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/iosExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.vibecody.vibecodyMobile</key><string>${IOS_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF
          flutter build ipa --release --no-tree-shake-icons \
            --export-options-plist="$RUNNER_TEMP/iosExportOptions.plist"

      - name: Build iOS (no codesign — archive for distribution)
        if: steps.ios-secrets.outputs.signed != 'true'
        working-directory: vibemobile
        run: |
          flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package IPA
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          if [ "${{ steps.ios-secrets.outputs.signed }}" = "true" ]; then
            IPA=$(ls vibemobile/build/ios/ipa/*.ipa 2>/dev/null | head -1)
            [ -n "$IPA" ] || { echo "::error::signed build produced no .ipa"; exit 1; }
            cp "$IPA" "dist/VibeCody-Mobile-${TAG}-ios.ipa"
            # Verify rather than trust: an .ipa that silently came out unsigned
            # is worse than one labelled unsigned.
            unzip -q -o "dist/VibeCody-Mobile-${TAG}-ios.ipa" -d "$RUNNER_TEMP/ipacheck"
            APP=$(ls -d "$RUNNER_TEMP/ipacheck/Payload/"*.app | head -1)
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier' || true
            if codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'Signature=adhoc'; then
              echo "::error::iOS app is ad-hoc signed despite a certificate being imported"
              exit 1
            fi
          else
            mkdir -p Payload
            cp -r vibemobile/build/ios/iphoneos/Runner.app Payload/
            zip -qr "dist/VibeCody-Mobile-${TAG}-ios.ipa" Payload
            rm -rf Payload
          fi
          ls -lh dist/

      - name: Upload iOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibemobile-ios
          path: dist/*

  # ─── VibeCody Watch — Wear OS (APK + AAB) ─────────────────────────────
  build-wear:
    name: Watch · Wear OS
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-wear-${{ hashFiles('vibewatch/VibeCodyWear/**/*.gradle*', 'vibewatch/VibeCodyWear/**/gradle-wrapper.properties') }}

      - name: Build Wear OS APK + AAB
        working-directory: vibewatch/VibeCodyWear
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Collect Wear OS artifacts
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          cp vibewatch/VibeCodyWear/app/build/outputs/apk/release/app-release*.apk \
             "dist/VibeCody-Wear-${TAG}.apk" 2>/dev/null || \
            cp vibewatch/VibeCodyWear/app/build/outputs/apk/release/app-release-unsigned.apk \
               "dist/VibeCody-Wear-${TAG}.apk"
          cp vibewatch/VibeCodyWear/app/build/outputs/bundle/release/app-release.aab \
             "dist/VibeCody-Wear-${TAG}.aab"
          ls -lh dist/

      - name: Upload Wear OS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibewatch-wear
          path: dist/*

  # ─── VibeCody Watch — watchOS (unsigned .app.zip) ─────────────────────
  build-watchos:
    name: Watch · watchOS
    needs: audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin Xcode 26 so builds link against the watchOS 26 SDK — required
      # for App Store Connect submissions from April 28, 2026 onward.
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1.7.0
        with:
          xcode-version: ^26.0

      - name: Build watchOS app (Simulator, unsigned)
        working-directory: vibewatch
        run: |
          xcodebuild \
            -project VibeCodyWatch.xcodeproj \
            -scheme VibeCodyWatch \
            -configuration Release \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package watchOS .app
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          APP_DIR=$(find vibewatch/build/DerivedData -type d -name "VibeCodyWatch.app" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "✗ VibeCodyWatch.app not found"; exit 1
          fi
          cd "$(dirname "$APP_DIR")"
          zip -r "$GITHUB_WORKSPACE/dist/VibeCody-WatchOS-${TAG}.app.zip" "VibeCodyWatch.app"
          ls -lh "$GITHUB_WORKSPACE/dist/"

      - name: Upload watchOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibewatch-watchos
          path: dist/*

  # ─── VibeCody Watch — watchOS signed IPA (TestFlight / Ad Hoc) ────────
  #
  # No-op unless APPLE_TEAM_ID is configured as a repo secret. To enable:
  #
  #   Required secrets:
  #     APPLE_TEAM_ID                         10-char team ID
  #     APPLE_CERT_P12_BASE64                 base64(distribution .p12)
  #     APPLE_CERT_P12_PASSWORD               password for the .p12
  #     APPLE_KEYCHAIN_PASSWORD               any random string (temp keychain)
  #     APPLE_PROVISIONING_PROFILE_BASE64     base64(.mobileprovision)
  #
  #   Optional (enables auto-upload to TestFlight):
  #     APPLE_ASC_KEY_ID                      App Store Connect API key ID
  #     APPLE_ASC_ISSUER_ID                   App Store Connect issuer ID
  #     APPLE_ASC_KEY_BASE64                  base64(AuthKey_<KEY_ID>.p8)
  #
  #   Optional repo variable:
  #     WATCHOS_EXPORT_METHOD                 'app-store-connect' (default)
  #                                           or 'release-testing' for Ad Hoc
  build-watchos-signed:
    name: Watch · watchOS (signed)
    needs: audit
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPORT_METHOD: ${{ vars.WATCHOS_EXPORT_METHOD || 'app-store-connect' }}
    steps:
      # Gate on every secret this job actually needs, not just the team ID.
      # APPLE_TEAM_ID is shared with the desktop signing jobs, so checking it
      # alone meant that configuring desktop signing silently armed this job
      # too — it would then run and die at the provisioning-profile step on an
      # empty secret. A red job on every release for a capability nobody asked
      # for is worse than skipping.
      #
      # (The `if:` that used to sit on this step referenced this step's own
      # output, which cannot exist yet. It always evaluated true — harmless
      # here, but it was not doing what it looked like it was doing.)
      - name: Check Apple signing credentials
        id: apple-secrets
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # Apple Distribution, not Developer ID: Developer ID signs macOS
          # apps distributed outside the App Store and cannot sign a watchOS
          # bundle at all.
          MISSING=""
          [ -n "${TEAM_ID:-}"  ] || MISSING="$MISSING APPLE_TEAM_ID"
          [ -n "${CERT_P12:-}" ] || MISSING="$MISSING APPLE_DIST_CERT_P12_BASE64"
          [ -n "${PROFILE:-}"  ] || MISSING="$MISSING APPLE_PROVISIONING_PROFILE_BASE64"
          if [ -n "$MISSING" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the signed watchOS build — missing secret(s):$MISSING. The unsigned watchOS artifact still builds in the 'Watch · watchOS' job."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.apple-secrets.outputs.skip != 'true'

      - name: Select Xcode 26
        if: steps.apple-secrets.outputs.skip != 'true'
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1.7.0
        with:
          xcode-version: ^26.0

      - name: Import signing certificate into temp keychain
        if: steps.apple-secrets.outputs.skip != 'true'
        env:
          # Apple Distribution — see the gate step above.
          CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}   # optional — generated when unset
        run: |
          set -euo pipefail
          # The keychain is created, used, and discarded inside this job, so
          # its password protects nothing that outlives the runner. Generating
          # one when the secret is unset removes a required secret — and with
          # it the silent failure where an empty password makes `security`
          # behave differently than intended.
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')

      - name: Install provisioning profile
        if: steps.apple-secrets.outputs.skip != 'true'
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$PROFILE_DIR/VibeCodyWatch.mobileprovision"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Archive watchOS app (device)
        if: steps.apple-secrets.outputs.skip != 'true'
        working-directory: vibewatch
        run: |
          xcodebuild archive \
            -project VibeCodyWatch.xcodeproj \
            -scheme VibeCodyWatch \
            -configuration Release \
            -destination 'generic/platform=watchOS' \
            -archivePath build/VibeCodyWatch.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

      - name: Write exportOptions.plist
        if: steps.apple-secrets.outputs.skip != 'true'
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA
        if: steps.apple-secrets.outputs.skip != 'true'
        working-directory: vibewatch
        run: |
          xcodebuild -exportArchive \
            -archivePath build/VibeCodyWatch.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"

      - name: Package IPA
        if: steps.apple-secrets.outputs.skip != 'true'
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          cp vibewatch/build/ipa/*.ipa "dist/VibeCody-WatchOS-${TAG}-signed.ipa"
          ls -lh dist/

      # Publishing to TestFlight is a different capability from producing a
      # signed IPA, and a different set of credentials. Gate it separately so a
      # signed artifact does not require App Store Connect API keys — and so
      # nothing is pushed to testers unless that was explicitly configured.
      - name: Upload to TestFlight
        if: steps.apple-secrets.outputs.skip != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APPLE_ASC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_BASE64:-}" ] || [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_ISSUER_ID:-}" ]; then
            echo "::notice::App Store Connect API key not configured — signed IPA built and uploaded as a workflow artifact, but not sent to TestFlight."
            exit 0
          fi
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls dist/VibeCody-WatchOS-*-signed.ipa | head -1)
          xcrun altool --upload-app \
            --type watchos \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload signed IPA artifact
        if: steps.apple-secrets.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibewatch-watchos-signed
          path: dist/*

  # ─── Linux forward-compat smoke (Ubuntu 24.04 / webkit2gtk-4.1) ──────
  #
  # Ubuntu 26.04 LTS drops 2026-04-23. GitHub will eventually roll
  # `ubuntu-latest` forward. This job validates that the Tauri crates
  # still compile against the webkit2gtk-4.1 headers shipped by newer
  # distros — purely informational; not in release.needs[] and flagged
  # continue-on-error so a future distro regression never blocks a tag.
  smoke-linux-next:
    name: Smoke · Linux-next (Ubuntu 24.04)
    needs: audit
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          key: smoke-linux-next
          workspaces: |
            vibecoder/src-tauri
            vibeaichat/src-tauri

      - name: Check VibeCoder Tauri crate
        working-directory: vibecoder/src-tauri
        run: cargo check --release

      - name: Check VibeAIChat Tauri crate
        working-directory: vibeaichat/src-tauri
        run: cargo check --release

  # ─── Docker image ──────────────────────────────────────────────────────
  build-docker:
    name: Docker Image
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          docker build -t vibecli:${TAG} -t vibecli:latest .
          docker save vibecli:${TAG} | gzip > vibecli-docker-${TAG}.tar.gz
          ls -lh vibecli-docker-*.tar.gz

      - name: Upload Docker artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibecli-docker
          path: vibecli-docker-*.tar.gz

  # ─── Firecracker Tier-3 rootfs ─────────────────────────────────────────
  # Builds the BusyBox + bash ext4 image consumed by the Tier-3 microVM
  # sandbox (slice F1 — see docs/design/sandbox-tiers/03-firecracker-tier.md).
  # The image is content-addressed via SHA256; the daemon verifies on
  # download before mounting. Cosign keyless attestation is added so a
  # third party can confirm the image was built from this commit + this
  # workflow run, not pushed by a compromised maintainer key.
  build-firecracker-rootfs:
    name: Firecracker Tier-3 Rootfs
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # required for cosign keyless OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Build rootfs.ext4
        run: |
          make rootfs-firecracker
          test -f target/firecracker-rootfs/rootfs.ext4
          test -f target/firecracker-rootfs/rootfs.ext4.sha256
          # Tag the artifact filename with the release version so it
          # doesn't collide with other releases in the same Releases page.
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p artifacts-rootfs
          cp target/firecracker-rootfs/rootfs.ext4 \
             "artifacts-rootfs/vibecody-firecracker-rootfs-${TAG}.ext4"
          cp target/firecracker-rootfs/rootfs.ext4.sha256 \
             "artifacts-rootfs/vibecody-firecracker-rootfs-${TAG}.ext4.sha256"
          ls -lh artifacts-rootfs/

      - name: Cosign keyless attest (Sigstore)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          IMG="artifacts-rootfs/vibecody-firecracker-rootfs-${TAG}.ext4"
          # `cosign sign-blob` issues a Fulcio cert from the GitHub Actions
          # OIDC token (no long-lived keys) and writes the signature +
          # cert next to the blob. `cosign verify-blob` on a downloader's
          # machine will then check the bundle against the Rekor transparency
          # log and the Fulcio root.
          cosign sign-blob --yes \
            --bundle "${IMG}.cosign.bundle" \
            "${IMG}"
          ls -lh "${IMG}.cosign.bundle"

      - name: Run F1 artifact-contract tests
        run: |
          cargo test -p vibe-sandbox-firecracker --test f1_rootfs_artifact

      - name: Upload Firecracker rootfs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibecody-firecracker-rootfs
          path: artifacts-rootfs/*

  # ─── Publish GitHub Release ────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [sbom, build-cli, build-vibecoder, build-vibeaichat, build-vibedesk, build-android, build-ios, build-wear, build-watchos, build-docker, build-firecracker-rootfs]
    # Publish even if optional jobs (mobile, watch, docker, SBOM, VibeDesk) fail.
    # Critical: CLI, VibeCoder, VibeAIChat, Firecracker rootfs must succeed.
    #
    # VibeDesk is deliberately NOT in the gate below yet: this is its first
    # release job and it has never been built on Linux or Windows, so a failure
    # there must not block the whole release. Promote it by adding
    # `needs.build-vibedesk.result == 'success'` once it has shipped green.
    if: >-
      ${{
        !cancelled() &&
        needs.build-cli.result == 'success' &&
        needs.build-vibecoder.result == 'success' &&
        needs.build-vibeaichat.result == 'success' &&
        needs.build-firecracker-rootfs.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List all artifacts
        run: find artifacts -type f | sort

      - name: Compute SHA256 checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" -o -name "*.apk" -o -name "*.aab" -o -name "*.ipa" \) -exec sha256sum {} \; | sed 's|  \./|  |' | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: VibeCody ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          # Prerelease when the *tag* looks like v1.2.3-rc1. Resolve the tag the
          # same way every other field here does — inputs.tag first — because
          # `github.ref_name` is the branch on a workflow_dispatch. Dispatching
          # v0.5.8 from `release/v0.5.8-ci-fixes` matched the '-' in the branch
          # name and published a stable release as a prerelease, which left
          # /releases/latest (and therefore install.sh) pointing at v0.5.7.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          body: |
            ## VibeCody ${{ github.event.inputs.tag || github.ref_name }}

            AI-powered developer toolchain — terminal assistant, desktop code editor, and mobile companion.

            ---

            ### Downloads

            #### VibeCLI — Terminal AI Assistant

            | Platform | Download |
            |----------|----------|
            | macOS (Apple Silicon) | `vibecli-aarch64-apple-darwin.tar.gz` |
            | macOS (Intel) | `vibecli-x86_64-apple-darwin.tar.gz` |
            | Linux x86_64 | `vibecli-x86_64-linux.tar.gz` |
            | Linux ARM64 | `vibecli-aarch64-linux.tar.gz` |
            | Windows x64 | `vibecli-x86_64-windows.zip` |
            | Docker | `vibecli-docker-*.tar.gz` |

            #### VibeCoder — Desktop Code Editor

            | Platform | Download |
            |----------|----------|
            | macOS (Apple Silicon) | `VibeCoder-macOS-arm64.app.zip` / `.dmg` |
            | macOS (Intel) | `VibeCoder-macOS-x64.app.zip` / `.dmg` |
            | Linux x64 | `.deb` / `.AppImage` |
            | Linux arm64 | `.deb` / `.AppImage` |
            | Windows x64 | `.msi` / `.exe` installer |

            #### VibeAIChat — Desktop AI Assistant

            | Platform | Download |
            |----------|----------|
            | macOS | `VibeAIChat_*.dmg` |
            | Linux x64 | `.deb` / `.AppImage` |
            | Linux arm64 | `.deb` / `.AppImage` |
            | Windows | `.msi` / `.exe` installer |

            #### VibeDesk — Task-First Desktop Shell

            | Platform | Download |
            |----------|----------|
            | macOS (Apple Silicon) | `VibeDesk_*_aarch64.dmg` |
            | macOS (Intel) | `VibeDesk_*_x64.dmg` |
            | Linux x64 | `.deb` / `.AppImage` |
            | Linux arm64 | `.deb` / `.AppImage` |
            | Windows x64 | `.msi` / `.exe` installer |

            #### VibeCody Mobile — iOS & Android

            | Platform | Download |
            |----------|----------|
            | Android (APK) | `VibeCody-Mobile-*-android.apk` |
            | Android (AAB) | `VibeCody-Mobile-*-android.aab` |
            | iOS (IPA) | `VibeCody-Mobile-*-ios.ipa` |

            #### VibeCody Watch — watchOS & Wear OS

            | Platform | Download |
            |----------|----------|
            | watchOS (Simulator .app, unsigned) | `VibeCody-WatchOS-*.app.zip` |
            | Wear OS (APK) | `VibeCody-Wear-*.apk` |
            | Wear OS (AAB) | `VibeCody-Wear-*.aab` |

