name: webview-probe

# The transport arm needs no audio hardware, so the question "can a webview
# reach a local WebRTC peer on this engine" can be answered on every push
# instead of being assumed. The AEC arm is deliberately absent: it needs a real
# microphone and speaker in one room, and a virtual loopback device would
# measure the driver rather than the echo canceller.

on:
  push:
    paths: ['tools/webview-probe/**', '.github/workflows/webview-probe.yml']
  pull_request:
    paths: ['tools/webview-probe/**', '.github/workflows/webview-probe.yml']
  workflow_dispatch:

jobs:
  transport:
    name: transport (${{ matrix.engine }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            engine: WKWebView
          - os: windows-latest
            engine: WebView2
          - os: ubuntu-latest
            engine: WebKitGTK
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb pulseaudio \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-nice \
            gstreamer1.0-tools
          # WebKitGTK's WebRTC is GStreamer's: the peer connection is built out
          # of the `bad` plugin set plus libnice for ICE. They arrive as apt
          # *recommends* of the webkit package, which is a chain that can break
          # without anything failing loudly — name them instead.
          # WebKitGTK can refuse to construct an AudioContext with no sink at
          # all. A null sink costs nothing and removes that as a variable.
          pulseaudio --start || true
          pactl load-module module-null-sink sink_name=probe || true

      # Which WebKitGTK this is, and whether the pieces WebRTC needs are even
      # present. Printed rather than assumed: `enable-webrtc` reads back true
      # on this runner and `RTCPeerConnection` is still undefined, and the only
      # thing that distinguishes "we set it wrong" from "this build has no
      # WebRTC compiled in" is the library itself.
      - name: What this WebKitGTK is
        if: runner.os == 'Linux'
        run: |
          echo "webkit2gtk-4.1: $(pkg-config --modversion webkit2gtk-4.1 || echo unknown)"
          lib=$(ls /usr/lib/*/libwebkit2gtk-4.1.so.0 2>/dev/null | head -1)
          echo "lib: $lib"
          echo "JS bindings for RTCPeerConnection: $(nm -D --defined-only "$lib" 2>/dev/null | grep -c RTCPeerConnection)"
          echo "RTCPeerConnection strings: $(strings -a "$lib" | grep -c '^RTCPeerConnection$')"
          # A missing *tool* must not be reported as a missing *element* — that
          # is the same class of mistake as a success-assuming fallback, and it
          # printed "webrtcbin: MISSING" on a runner where nothing had looked.
          if command -v gst-inspect-1.0 >/dev/null 2>&1; then
            for el in webrtcbin nicesrc opusenc; do
              gst-inspect-1.0 "$el" >/dev/null 2>&1 \
                && echo "gst $el: present" || echo "gst $el: missing"
            done
          else
            echo "gst-inspect-1.0: not installed — element presence not checked"
          fi
          dpkg -l | grep -E 'gstreamer1.0-(plugins|nice|tools)|libnice|webkit2gtk' | awk '{print $2, $3}'

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/webview-probe

      - name: Build
        working-directory: tools/webview-probe
        run: cargo build --release

      # A webview needs a display even when nothing looks at it.
      #
      # Exit 3 means the engine exposes no `RTCPeerConnection` at all, and on
      # Ubuntu that is the shipped WebKitGTK rather than anything this repo
      # can change: measured on this runner, `enable-webrtc` reads back true,
      # the page is loaded after it is set, `MediaStream` and `mediaDevices`
      # both exist, and GStreamer's webrtcbin, nicesrc and opusenc are all
      # installed — WebRTC is simply not compiled into 2.52.3-0ubuntu0.24.04.1.
      #
      # So it is reported and not failed **here only**: a skip, loudly, with
      # the result still uploaded. It is not a pass and it is not silent, and
      # the arm re-arms itself the day the distro ships WebRTC — the run stops
      # exiting 3 and has to pass like everyone else. Exit 3 on macOS or
      # Windows still fails: those engines have the API, so losing it there
      # would be a regression, which is the case this narrowness protects.
      - name: Run transport arm (Linux)
        if: runner.os == 'Linux'
        working-directory: tools/webview-probe
        run: |
          set +e
          xvfb-run -a ./target/release/webview-probe --arm transport --out result.json
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning title=WebRTC absent from this engine::WebKitGTK on this runner exposes no RTCPeerConnection, so the transport arm could not run. See result.json (engineSettings + caps) for what was measured."
            exit 0
          fi
          exit "$rc"

      - name: Run transport arm
        if: runner.os != 'Linux'
        working-directory: tools/webview-probe
        run: ./target/release/webview-probe --arm transport --out result.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview-probe-${{ matrix.engine }}
          path: tools/webview-probe/result.json
          if-no-files-found: warn
