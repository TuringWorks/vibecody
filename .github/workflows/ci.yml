name: CI

# Gate for every PR and push to main. Runs the test suite, linters, and format
# checks across all four ecosystems (Rust, TypeScript/Node, Flutter/Dart, Kotlin).
# See docs/security/threat-model.md §7 for the security-gate companion.

on:
  pull_request:
  push:
    branches: [main]
  # Allow manual trigger for debugging
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  FLUTTER_VERSION: "3.44.9"
  JAVA_VERSION: "17"

jobs:
  # ─── Rust: fmt, clippy, test ───────────────────────────────────────────
  rust-checks:
    name: Rust (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy

      # Tauri system deps — required by vibe-coder / vibeaichat crates on Linux.
      # Both clippy and test compile the full workspace (including Tauri crates)
      # which transitively depends on webkit2gtk-sys → glib-sys.
      - name: Install Linux system dependencies
        if: matrix.check == 'clippy' || matrix.check == 'test'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-${{ matrix.check }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-ci-${{ matrix.check }}-

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Check formatting
        if: matrix.check == 'fmt'
        run: cargo fmt --all -- --check

      # NOTE: --all-features is intentionally omitted. Several workspace
      # features (candle-metal, mistralrs-metal) require macOS/Apple
      # platforms and won't compile on Linux. Those features are covered by
      # the `metal-gpu-tests` job below — NOT by the release workflow, which
      # does not pass --all-features either (it gets mistralrs-metal via the
      # cfg(target_os = "macos") dep in vibecli/Cargo.toml, and never runs
      # these tests).
      - name: Run clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --workspace

      - name: Run tests
        if: matrix.check == 'test'
        # A handful of tests mutate process-wide env vars (VIBECLI_SKILLS_DIR,
        # HOME). Run them serially to avoid races between concurrent tests
        # sharing one global env. Locally `cargo test` defaults to threads=N,
        # which masks these races on dev machines.
        #
        # --lib --bins --tests skips doctests. Several module-level `//!` docs
        # contain ```-fenced REPL command listings that rustdoc treats as Rust
        # code and tries to compile (and fails). Those need a separate cleanup
        # pass (s/```/```text/) — tracked separately so the CI gate stays green.
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test --workspace --exclude vibe-memory --exclude vibe-broker --lib --bins --tests

      # The eval suites are data, so nothing else in the build checks them: a
      # typo in a grader key, a duplicate task id, or an assertion naming a
      # fixture file that does not exist would surface only as a confusing
      # mid-run error — or, worse, as a task that quietly stops testing
      # anything. Called out as its own step so a suite break reads as a suite
      # break rather than as one line in the workspace test output.
      #
      # This runs no agent and calls no provider, so it costs nothing and needs
      # no API key. Actually *running* the evals is deliberately not in CI:
      # that spends tokens and belongs behind `make eval-offline`.
      - name: Validate eval suites
        if: matrix.check == 'test'
        run: cargo test -p vibe-eval --test suites_are_valid

  # ─── VibeCoder: TypeScript + React ────────────────────────────────────────
  vibecoder-checks:
    name: VibeCoder (${{ matrix.check }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibecoder
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # package-lock.json is gitignored, so we use npm install (not npm ci).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint (ESLint)
        if: matrix.check == 'lint'
        run: npm run lint

      - name: Type check (tsc --noEmit)
        if: matrix.check == 'typecheck'
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        if: matrix.check == 'test'
        run: npm test

      # Nothing else here bundles the app, and neither `tsc` nor `vitest`
      # notices a module that only the bundler resolves. A monaco-editor bump
      # once broke every `monaco-editor/esm/vs/**` worker import — the editor
      # would have shipped stuck on "Loading..." — while typecheck and 1359
      # unit tests stayed green. This step is the only thing that sees it.
      - name: Production bundle (vite build)
        if: matrix.check == 'build'
        run: npx vite build

  # ─── VibeAIChat: TypeScript ───────────────────────────────────────────────
  vibeaichat-checks:
    name: VibeAIChat (${{ matrix.check }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibeaichat
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # package-lock.json is gitignored, so we use npm install (not npm ci).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check (tsc --noEmit)
        if: matrix.check == 'typecheck'
        run: npx tsc --noEmit

  # ─── VibeDesk: TypeScript ──────────────────────────────────────────────
  vibedesk-checks:
    name: VibeDesk (${{ matrix.check }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibedesk
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, no-inline-edit, invoke-parity]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # package-lock.json is gitignored, so we use npm install (not npm ci).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check (tsc --noEmit)
        if: matrix.check == 'typecheck'
        run: npx tsc --noEmit

      - name: No-inline-edit guard
        if: matrix.check == 'no-inline-edit'
        run: npm run lint:no-inline-edit

      # The frontend↔Tauri join. `tsc` cannot see it: a command name is a bare
      # string on one side and a handler list nobody imports on the other, so an
      # unregistered command compiles clean and fails when a user clicks.
      - name: Invoke-handler parity
        if: matrix.check == 'invoke-parity'
        run: npm run lint:invoke-parity

  # ─── Agent SDK: TypeScript ─────────────────────────────────────────────
  agent-sdk-checks:
    name: Agent SDK (${{ matrix.check }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-sdk
    strategy:
      fail-fast: false
      matrix:
        check: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # package-lock.json is gitignored, so we use npm install (not npm ci).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check + lint (tsc --noEmit)
        if: matrix.check == 'lint'
        run: npm run lint

      - name: Unit tests (vitest)
        if: matrix.check == 'test'
        run: npm test

  # ─── VibeCody Mobile: Flutter/Dart ────────────────────────────────────
  mobile-checks:
    name: Mobile (${{ matrix.check }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibemobile
    strategy:
      fail-fast: false
      matrix:
        check: [analyze, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Dart analyze
        if: matrix.check == 'analyze'
        run: dart analyze --fatal-infos

      - name: Flutter test
        if: matrix.check == 'test'
        run: flutter test

  # ─── Documentation: Markdown linting ────────────────────────────────
  docs-check:
    name: Documentation (${{ matrix.check }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        check: [lint, version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Docs advertised 0.5.5 three releases after it shipped, and the mobile /
      # watch download tables pointed at v0.5.7 assets after v0.5.8 was tagged.
      # A stale version renders perfectly, so only a check catches it.
      - name: Check docs reference the current release
        if: matrix.check == 'version'
        run: ./scripts/check-docs-version.sh

      # The site is a project site under /vibecody/, so a link written as
      # `](/ghost-text/)` resolves to the domain root and 404s while the page
      # itself is fine. It renders correctly and reads correctly in the diff;
      # only clicking it fails. Fifteen shipped that way.
      - name: Check docs links resolve
        if: matrix.check == 'version'
        run: ./scripts/check-docs-links.sh

      - name: Setup Node
        if: matrix.check == 'lint'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # This install line previously named packages that do not exist, so the
      # job died here before remark ever ran: `@wooorm/storyline-preset` (404,
      # and not referenced by .remarkrc.json at all), `remark-lint-max-blank-lines`
      # (404 — the real rule is no-consecutive-blank-lines),
      # `remark-lint-no-duplicate-headers` (404 — it is -headings), and
      # `remark-lint-maximum-line-length@6` (no such major; 4.x is latest).
      # Plugins now come from the preset, so only two packages are needed.
      - name: Install remark and plugins
        if: matrix.check == 'lint'
        run: npm install remark-cli@12 remark-preset-lint-recommended@7

      - name: Lint Markdown files
        if: matrix.check == 'lint'
        # `--ignore-component-path` is not a remark-cli option — it aborted the
        # run with "Unknown option". `--no-stdout` keeps remark from echoing
        # every linted document; we only want the report.
        run: npx remark . --frail --quiet --no-stdout

  # ─── Metal GPU tests (macOS) ───────────────────────────────────────────
  # The only job that exercises the TurboQuant KV-cache codec on a real GPU.
  # Everything else in this workflow runs on ubuntu-latest, where
  # `mistralrs-metal` cannot build — so without this job the GPU path is
  # compiled in macOS release builds but never *executed* anywhere in CI.
  #
  # This is not hypothetical. The 2026-08 mistral.rs v0.9 sync introduced two
  # bugs that only this test catches: an output buffer bound as an input
  # (kernel dispatched fine, values wrong by 1.48 vs a 5e-3 tolerance), and a
  # file-scope `SIMD_SIZE` that collided in the concatenated runtime
  # translation unit and disabled *every* quant kernel. A green `cargo check`
  # and a successful dispatch both looked like success.
  #
  # Both Metal paths are run because they exercise different code and each
  # caught a different one of those two bugs:
  #   - default            → precompiled AOT metallib
  #   - PRECOMPILE=0       → kernels compiled at runtime into one combined TU
  metal-gpu-tests:
    name: Metal GPU tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-metal-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-metal-

      # AOT path: build.rs precompiles the .metal sources into a metallib.
      - name: Test TurboQuant codec (precompiled metallib)
        run: cargo test -p vibe-infer --features mistralrs,mistralrs-metal

      # Runtime path: no metallib, so mistralrs-metal-compile concatenates every
      # .metal source into a single translation unit and compiles it on first
      # use. This is also the fallback when the Apple Metal Toolchain component
      # is unavailable, so it must keep working.
      - name: Test TurboQuant codec (runtime-compiled kernels)
        env:
          MISTRALRS_METAL_PRECOMPILE: "0"
        run: cargo test -p vibe-infer --features mistralrs,mistralrs-metal

  # ─── Wear OS: release build ────────────────────────────────────────────
  # assembleRelease, not assembleDebug: the release variant is the one that
  # runs lintVital and R8, and every fault that had accumulated here — the AGP
  # 9 Kotlin-plugin clash, the missing proguard-rules.pro, the compileSdk floor
  # demanded by androidx.lifecycle — surfaced only in that variant. Until now
  # this module was built solely by release.yml, so it broke at release time.
  wear-checks:
    name: Wear OS (${{ matrix.check }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibewatch/VibeCodyWear
    strategy:
      fail-fast: false
      matrix:
        check: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # compileSdk is 37, so the platform package is android-37.0 — note the
      # minor-version suffix; `platforms;android-37` does not exist.
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-wear-ci-${{ hashFiles('vibewatch/VibeCodyWear/**/*.gradle*', 'vibewatch/VibeCodyWear/**/gradle-wrapper.properties', 'vibewatch/VibeCodyWear/gradle/libs.versions.toml') }}
          restore-keys: gradle-wear-ci-

      - name: Release build (assembleRelease)
        if: matrix.check == 'build'
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease

  # ─── JetBrains plugin: build + unit tests ──────────────────────────────
  # This module was in no workflow at all, which is how it reached a state
  # where it did not compile and its 14 HookExecutor tests had never run.
  # A cold cache downloads the IntelliJ IDEA Community distribution (~1 GB);
  # the Gradle cache below makes subsequent runs cheap.
  jetbrains-checks:
    name: JetBrains plugin (${{ matrix.check }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetbrains-plugin
    strategy:
      fail-fast: false
      matrix:
        check: [build, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-jetbrains-ci-${{ hashFiles('jetbrains-plugin/**/*.gradle*', 'jetbrains-plugin/gradle.properties', 'jetbrains-plugin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-jetbrains-ci-

      - name: Build plugin
        if: matrix.check == 'build'
        run: |
          chmod +x ./gradlew
          ./gradlew buildPlugin verifyPluginStructure

      - name: Unit tests
        if: matrix.check == 'test'
        run: |
          chmod +x ./gradlew
          ./gradlew test

  # ─── Aggregate gate ────────────────────────────────────────────────────
  # Single required check for branch protection — easier than listing every
  # individual job in repo settings.
  ci-gate:
    name: CI gate (required)
    runs-on: ubuntu-latest
    needs:
      - rust-checks
      - metal-gpu-tests
      - vibecoder-checks
      - vibeaichat-checks
      - vibedesk-checks
      - agent-sdk-checks
      - mobile-checks
      - wear-checks
      - jetbrains-checks
      - docs-check
    if: always()
    steps:
      - name: Aggregate result
        run: |
          if [[ "${{ needs.rust-checks.result }}"      != "success" ]] || \
             [[ "${{ needs.metal-gpu-tests.result }}"  != "success" ]] || \
             [[ "${{ needs.vibecoder-checks.result }}"    != "success" ]] || \
             [[ "${{ needs.vibeaichat-checks.result }}"   != "success" ]] || \
             [[ "${{ needs.vibedesk-checks.result }}"  != "success" ]] || \
             [[ "${{ needs.agent-sdk-checks.result }}" != "success" ]] || \
             [[ "${{ needs.mobile-checks.result }}"    != "success" ]] || \
             [[ "${{ needs.wear-checks.result }}"      != "success" ]] || \
             [[ "${{ needs.jetbrains-checks.result }}" != "success" ]] || \
             [[ "${{ needs.docs-check.result }}"       != "success" ]]; then
            echo "::error::One or more CI checks failed. See individual job logs."
            exit 1
          fi
          echo "All CI checks passed."
