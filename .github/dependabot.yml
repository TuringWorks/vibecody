# Dependabot configuration — auto-file PRs for dependency bumps across all four
# ecosystems VibeCody ships. See AGENTS.md → Product Matrix for the full surface.
#
# Security-only updates (cargo-audit, npm audit, pip-audit) run in
# .github/workflows/security.yml — Dependabot handles version bumps, not advisories.

version: 2
updates:
  # ─── Rust (workspace Cargo.toml) ──────────────────────────────────────────
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    # Group minor/patch bumps to reduce PR noise; major bumps stay separate.
    groups:
      rust-minor:
        update-types: [minor, patch]

  # ─── VibeCoder (Tauri + React) ───────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /vibecoder
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - typescript
    groups:
      vibecoder-minor:
        update-types: [minor, patch]

  # ─── VibeAIChat (Tauri shell) ────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /vibeaichat
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - typescript
    groups:
      vibeaichat-minor:
        update-types: [minor, patch]

  # ─── Agent SDK ────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /packages/agent-sdk
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - typescript
    groups:
      agent-sdk-minor:
        update-types: [minor, patch]

  # ─── VibeDesk (Tauri shell) ───────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /vibedesk
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - typescript
    groups:
      vibedesk-minor:
        update-types: [minor, patch]

  # ─── VS Code extension ────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /vscode-extension
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - typescript
    groups:
      vscode-extension-minor:
        update-types: [minor, patch]

  # ─── vibe-rl-py (Python, uv.lock) ─────────────────────────────────────────
  # Dependabot already *alerts* on vibe-rl-py/uv.lock via the dependency graph,
  # but without an entry here it never opened a fix PR — the pillow and
  # setuptools advisories had to be bumped by hand.
  - package-ecosystem: uv
    directory: /vibe-rl-py
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      vibe-rl-py-minor:
        update-types: [minor, patch]

  # ─── VibeCody Mobile (Flutter/Dart) ───────────────────────────────────────
  - package-ecosystem: pub
    directory: /vibemobile
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - flutter

  # ─── JetBrains plugin (Kotlin/Gradle) ─────────────────────────────────────
  # Ships as a client per the Product Matrix but had no coverage at all;
  # declares gson + junit directly.
  - package-ecosystem: gradle
    directory: /jetbrains-plugin
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - kotlin

  # ─── VibeMobile Android host (Kotlin/Gradle) ──────────────────────────────
  # The `pub` entry above covers pubspec.yaml only — it does not see the
  # Android host's Gradle deps, which include okhttp (network-facing, used by
  # the Wear relay) and play-services-wearable.
  - package-ecosystem: gradle
    directory: /vibemobile/android
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - kotlin

  # ─── Wear OS (Kotlin/Gradle) ──────────────────────────────────────────────
  - package-ecosystem: gradle
    directory: /vibewatch/VibeCodyWear
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - kotlin

  # ─── GitHub Actions ──────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
