[package]
name = "vibeaichat"
version.workspace = true
description = "Standalone VibeCody desktop application shell"
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "vibeaichat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
# Settings screens (Providers / Appearance / Account) are shared with
# VibeDesk; their Tauri commands live in this crate so both shells drive
# the same ProfileStore code.
vibe-desktop-settings = { path = "../../crates/vibe-desktop-settings" }
# Voice input — the same daemon bridge every shell uses (crates/vibe-desktop-voice).
vibe-desktop-voice = { path = "../../crates/vibe-desktop-voice" }
# Daemon autostart + `/health` identity probe. AGENTS.md is explicit that this
# logic has exactly one implementation (`vibecli/vibecli-cli/src/daemon_bootstrap.rs`)
# and that clients must not write another copy — so this shell takes the
# dependency rather than reimplementing "is it running, and if not, start it".
# VibeDesk already depends on the same crate for the same reason.
vibecli_cli = { package = "vibecli", path = "../../vibecli/vibecli-cli" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
