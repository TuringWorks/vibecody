<!doctype html><meta charset="utf-8"><title>VibeCody — full-duplex voice</title>
<style>
  :root{--bg:#0e1116;--fg:#e6edf3;--dim:#8b949e;--line:#232a33;--ok:#3fb950;--hot:#f78166;--acc:#58a6ff}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.55 ui-sans-serif,-apple-system,system-ui;height:100vh;display:flex;flex-direction:column}
  header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
  #dot{width:11px;height:11px;border-radius:50%;background:var(--dim);flex:none;transition:.15s}
  #dot.listening{background:var(--ok);box-shadow:0 0 0 4px rgba(63,185,80,.16)}
  #dot.hearing{background:var(--acc);box-shadow:0 0 0 4px rgba(88,166,255,.18)}
  #dot.thinking{background:#d29922;box-shadow:0 0 0 4px rgba(210,153,34,.16)}
  #dot.speaking{background:var(--hot);box-shadow:0 0 0 4px rgba(247,129,102,.18)}
  #state{font-weight:600;letter-spacing:.2px} #meta{margin-left:auto;color:var(--dim);font-size:12px}
  select,input[type=range]{background:#161b22;color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:4px 7px;font:inherit;font-size:12px}
  select{max-width:230px} input[type=range]{padding:0;width:96px;accent-color:var(--acc)}
  #banner{display:none;padding:9px 18px;background:#2d2410;border-bottom:1px solid #4a3a12;
    color:#e3b341;font-size:12.5px;line-height:1.5}
  #banner b{color:#f0c674} #banner code{background:#00000040;padding:1px 5px;border-radius:4px}
  #level{height:3px;background:var(--line)} #levelbar{height:100%;width:0;background:var(--acc);transition:width .05s}
  #log{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .turn{max-width:82%;padding:9px 13px;border-radius:13px;white-space:pre-wrap}
  .me{align-self:flex-end;background:#1f6feb;color:#fff;border-bottom-right-radius:4px}
  .ai{align-self:flex-start;background:#161b22;border:1px solid var(--line);border-bottom-left-radius:4px}
  .turn.sys{align-self:center;background:none;border:0;color:var(--dim);font-size:12px;padding:2px}
  .me.interim{opacity:.5;font-style:italic}
  .turn.lat{align-self:flex-start;background:none;border:0;color:var(--dim);font-size:11px;font-family:ui-monospace,monospace;margin-top:-8px;padding:0 4px}
  .barge{align-self:center;color:var(--hot);font-size:11px;font-family:ui-monospace,monospace}
  footer{padding:9px 18px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;
    font-family:ui-monospace,monospace;display:flex;gap:16px;flex-wrap:wrap}
</style>
<header>
  <div id="dot"></div><div id="state">starting…</div>
  <select id="lang" title="spoken language">
    <option value="en">English (fast)</option>
    <option value="auto">Auto-detect (99 languages)</option>
  </select>
  <select id="voice" title="assistant voice"><option>loading…</option></select>
  <label style="color:var(--dim);font-size:12px;display:flex;align-items:center;gap:6px">
    rate <input type="range" id="rate" min="0.35" max="0.70" step="0.01" value="0.52">
  </label>
  <div id="meta"></div>
</header>
<div id="banner"></div>
<div id="level"><div id="levelbar"></div></div>
<div id="log"></div>
<footer>
  <span>mic <b id="mic">–</b></span><span>AEC <b id="aec">–</b></span><span>asr <b id="asr">–</b></span>
  <span>lang <b id="detlang">–</b></span><span>last turn <b id="lastturn">–</b></span><span>best first-audio <b id="best">–</b></span>
  <span id="hint" style="margin-left:auto">the mic never closes — interrupt whenever you like</span>
</footer>
<script>
const $ = id => document.getElementById(id);
const log = $('log');
let ws, playCtx, nextAt = 0, live = [], ttsRate = 22050, best = Infinity, interim = null;

function line(cls, text){
  const d = document.createElement('div'); d.className = 'turn ' + cls; d.textContent = text;
  // Arabic, Hebrew and Urdu are right-to-left; without this a mixed-script
  // reply renders with its clauses in the wrong order.
  d.dir = 'auto';
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function setState(s){
  $('dot').className = s;
  $('state').textContent = {listening:'Listening', hearing:'Hearing you', thinking:'Thinking', speaking:'Speaking'}[s] || s;
}

// ── playback queue ─────────────────────────────────────────────────────────
// Chunks are scheduled back-to-back on the AudioContext clock. Barge-in stops
// every scheduled source and resets the cursor — that is what makes an
// interruption feel immediate rather than "after this sentence".
function enqueue(f32){
  if (!playCtx) return;
  const buf = playCtx.createBuffer(1, f32.length, ttsRate);
  buf.copyToChannel(f32, 0);
  const src = playCtx.createBufferSource();
  src.buffer = buf; src.connect(playCtx.destination);
  const now = playCtx.currentTime;
  if (nextAt < now + 0.02) nextAt = now + 0.02;
  src.start(nextAt);
  nextAt += buf.duration;
  live.push(src);
  src.onended = () => { live = live.filter(s => s !== src); };
}
function flush(){
  live.forEach(s => { try { s.stop(); } catch(e){} });
  live = []; nextAt = 0;
}

// ── capture ────────────────────────────────────────────────────────────────
const WORKLET = `
class Cap extends AudioWorkletProcessor {
  process(inputs){
    const ch = inputs[0][0];
    if (ch) {
      const pcm = new Int16Array(ch.length);
      let peak = 0;
      for (let i=0;i<ch.length;i++){
        const s = Math.max(-1, Math.min(1, ch[i]));
        pcm[i] = s < 0 ? s*0x8000 : s*0x7FFF;
        const a = Math.abs(s); if (a > peak) peak = a;
      }
      this.port.postMessage({pcm, peak}, [pcm.buffer]);
    }
    return true;
  }
}
registerProcessor('cap', Cap);`;

async function start(){
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, autoGainControl: true, noiseSuppression: true }
    });
  } catch(e){ line('sys', 'microphone denied: ' + e.message); setState('error'); return; }

  const track = stream.getAudioTracks()[0];
  const st = track.getSettings ? track.getSettings() : {};
  $('mic').textContent = track.label || 'default';
  // Report what the engine actually applied, not what we asked for. On
  // WebKit, autoGainControl and noiseSuppression are absent from
  // getSupportedConstraints entirely — echoCancellation is the only one.
  $('aec').textContent = st.echoCancellation === true ? 'on' : String(st.echoCancellation);

  // 16 kHz for capture (what whisper wants), a separate context at the TTS
  // rate for playback — cheaper and more honest than resampling by hand.
  const capCtx = new AudioContext({ sampleRate: 16000 });
  await capCtx.resume();
  playCtx = new AudioContext({ sampleRate: ttsRate });
  await playCtx.resume();

  await capCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], {type:'application/javascript'})));
  const node = new AudioWorkletNode(capCtx, 'cap');
  capCtx.createMediaStreamSource(stream).connect(node);
  // A worklet with no downstream connection is not pulled in some engines.
  const mute = capCtx.createGain(); mute.gain.value = 0;
  node.connect(mute).connect(capCtx.destination);

  node.port.onmessage = e => {
    const { pcm, peak } = e.data;
    $('levelbar').style.width = Math.min(100, peak * 260) + '%';
    if (ws && ws.readyState === 1) ws.send(pcm.buffer);
  };
  $('meta').textContent = `capture ${capCtx.sampleRate} Hz · playback ${playCtx.sampleRate} Hz`;
}

// ── wire ───────────────────────────────────────────────────────────────────
ws = new WebSocket('ws://127.0.0.1:__WS_PORT__');
ws.binaryType = 'arraybuffer';
ws.onopen = () => start();
ws.onclose = () => { setState('error'); $('state').textContent = 'disconnected'; };
// ── voice picker ───────────────────────────────────────────────────────────
const VOICE_KEY = 'vd.voice', RATE_KEY = 'vd.rate', LANG_KEY = 'vd.lang';
const LANG_NAMES = {en:'English',es:'Spanish',fr:'French',de:'German',it:'Italian',pt:'Portuguese',
  nl:'Dutch',ru:'Russian',pl:'Polish',uk:'Ukrainian',tr:'Turkish',ar:'Arabic',he:'Hebrew',hi:'Hindi',
  bn:'Bengali',ta:'Tamil',te:'Telugu',kn:'Kannada',ja:'Japanese',ko:'Korean',zh:'Chinese',vi:'Vietnamese',
  th:'Thai',id:'Indonesian',ms:'Malay',sv:'Swedish',da:'Danish',nb:'Norwegian',fi:'Finnish',cs:'Czech',
  sk:'Slovak',hu:'Hungarian',ro:'Romanian',el:'Greek',bg:'Bulgarian',hr:'Croatian',ca:'Catalan',sl:'Slovenian'};
const SAMPLE = "Here's how I sound. Pick whichever you prefer.";

let allVoices = [];
function fillLanguages(d){
  const sel = $('lang');
  // Only offer languages we can actually answer in — a language with no voice
  // would transcribe and then fall silent.
  for (const code of (d.languages || [])) {
    if (code === 'en') continue;
    const o = document.createElement('option');
    o.value = code; o.textContent = LANG_NAMES[code] || code;
    sel.appendChild(o);
  }
  const saved = localStorage.getItem(LANG_KEY);
  if (saved) { sel.value = saved; ws.send(JSON.stringify({type:'set_language', lang: saved})); }
}
function fillVoices(d){
  allVoices = d.voices;
  const sel = $('voice');
  sel.innerHTML = '';
  const groups = { premium: 'Premium (neural)', enhanced: 'Enhanced (neural)', default: 'Compact' };
  // Novelty voices (Bells, Boing, Bubbles…) are not assistants; keep them out
  // of the default view rather than making someone scroll past them.
  // Show voices for the language in play; everything else is noise in a dropdown
  // of 180.
  const want = ($('lang').value === 'auto') ? null : $('lang').value;
  const usable = d.voices.filter(v => !v.novelty && (!want || v.lang.startsWith(want)));
  for (const q of ['premium','enhanced','default']) {
    const rows = usable.filter(v => v.quality === q);
    if (!rows.length) continue;
    const g = document.createElement('optgroup'); g.label = groups[q];
    for (const v of rows) {
      const o = document.createElement('option');
      o.value = v.id; o.textContent = `${v.name} · ${v.lang}`;
      g.appendChild(o);
    }
    sel.appendChild(g);
  }
  const saved = localStorage.getItem(VOICE_KEY);
  const best = usable.find(v => v.quality !== 'default') || usable.find(v => v.id === d.default) || usable[0];
  sel.value = (saved && usable.some(v => v.id === saved)) ? saved : (best ? best.id : '');
  if (sel.value) ws.send(JSON.stringify({type:'set_voice', id: sel.value}));   // no sample on load

  if (!d.hasNeural) {
    const b = $('banner');
    b.style.display = 'block';
    b.innerHTML = `<b>Only compact voices are installed</b> — these are the concatenative tier and they do sound mechanical.
      The neural ones are a free download: <code>System Settings → Accessibility → Spoken Content → System Voice → Manage Voices</code>,
      then pick any <b>Enhanced</b> or <b>Premium</b> English voice. They appear here automatically on the next restart.`;
  }
}
$('lang').addEventListener('change', e => {
  localStorage.setItem(LANG_KEY, e.target.value);
  localStorage.removeItem(VOICE_KEY);          // let the voice follow the language again
  ws.send(JSON.stringify({type:'set_language', lang: e.target.value}));
  if (allVoices.length) fillVoices({voices: allVoices, hasNeural: true, default: ''});
  line('sys', e.target.value === 'auto'
    ? 'auto-detect on — Whisper identifies the language each turn (slower than English)'
    : 'language: ' + (LANG_NAMES[e.target.value] || e.target.value));
});
$('voice').addEventListener('change', e => {
  localStorage.setItem(VOICE_KEY, e.target.value);
  flush();                                                    // stop whatever is speaking
  ws.send(JSON.stringify({type:'set_voice', id: e.target.value, sample: SAMPLE}));
});
$('rate').addEventListener('input', e => {
  localStorage.setItem(RATE_KEY, e.target.value);
  ws.send(JSON.stringify({type:'set_rate', rate: parseFloat(e.target.value)}));
});

ws.onmessage = ev => {
  if (ev.data instanceof ArrayBuffer) { enqueue(new Float32Array(ev.data)); return; }
  const m = JSON.parse(ev.data);
  switch (m.type) {
    case 'ready':      ttsRate = m.tts_rate || 22050; line('sys', 'model: ' + m.model + ' — warming'); break;
    case 'warm':       line('sys', `ready (model warm in ${m.llm_ms} ms) — speak whenever`); break;
    case 'state':      setState(m.state); break;
    case 'asr':        $('asr').textContent = m.engine; break;
    case 'voices':
      fillLanguages(m.list);
      fillVoices(m.list);
      { const r = localStorage.getItem(RATE_KEY);
        if (r) { $('rate').value = r; ws.send(JSON.stringify({type:'set_rate', rate: parseFloat(r)})); } }
      break;
    // Interim hypotheses arrive while you are still talking — the visible half
    // of streaming ASR, and the reason end-of-speech only has to finalise.
    case 'partial':
      if (!interim) { interim = line('me interim', ''); }
      interim.textContent = m.text;
      log.scrollTop = log.scrollHeight;
      break;
    case 'flush':      flush(); if (interim) { interim.remove(); interim = null; } break;
    case 'transcript':
      if (interim) { interim.className = 'turn me'; interim.textContent = m.text; interim = null; }
      else line('me', m.text);
      break;
    case 'reply':
      line('lat', `asr ${m.asr_ms}ms · llm ttft ${m.llm_ttft_ms}ms · turn ${m.total_ms}ms`);
      $('lastturn').textContent = m.total_ms + ' ms';
      break;
    case 'speaking':   line('ai', m.text); break;
    case 'latency':
      if (m.first_audio_ms < best) { best = m.first_audio_ms; $('best').textContent = best + ' ms'; }
      break;
    case 'detected':
      $('detlang').textContent = LANG_NAMES[m.lang] || m.lang;
      break;
    case 'voice_auto':
      { const v = allVoices.find(x => x.id === m.id);
        line('sys', `voice → ${v ? v.name : m.id} (${LANG_NAMES[m.lang] || m.lang})`);
        if (v) { fillVoices({voices: allVoices, hasNeural: true, default: ''}); $('voice').value = m.id; } }
      break;
    case 'language':   break;
    case 'error':      line('sys', 'error: ' + m.message); break;
  }
};
</script>
