[package]
name = "voice-duplex"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "voice-duplex"
path = "src/main.rs"

[dependencies]
wry = "0.53"
tao = "0.35"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tiny_http = "0.12"
serde_json = "1"
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }

[profile.release]
opt-level = 2

[workspace]
