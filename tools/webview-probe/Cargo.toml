[package]
name = "webview-probe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "webview-probe"
path = "src/main.rs"

[dependencies]
wry = "0.53"
tao = "0.35"
webrtc = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tiny_http = "0.12"
serde_json = "1"
anyhow = "1"

[profile.dev]
opt-level = 1

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }

[workspace]
