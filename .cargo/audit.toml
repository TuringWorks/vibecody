# cargo-audit suppressions.
#
# cargo-audit reads this file automatically when run from the repo root, so
# neither workflow passes `--ignore` flags any more. The list used to be
# copy-pasted into .github/workflows/release.yml and
# .github/workflows/security.yml; they drifted, and on 2026-08-10 the v0.5.8
# release failed because release.yml was the copy missing RUSTSEC-2026-0215
# (smallstr, unmaintained).
#
# deny.toml is the AUTHORITATIVE list — cargo-deny cannot read this file, and
# only its schema carries a reason per entry. This file mirrors deny.toml's
# `[advisories].ignore` ids. The `Suppression lists agree` step in
# security.yml compares the two id sets and fails on any difference, which is
# what makes "they cannot disagree" true rather than aspirational. When you
# add, remove, or expire a suppression, edit deny.toml first and mirror it
# here in the same commit.
#
# Policy — both workflows run `cargo audit --deny warnings`, so an
# `unmaintained` crate blocks a release as well as a PR. That is stricter
# than it needs to be (an unmaintained crate is a supply-chain signal, not an
# exploit, and it makes any upstream maintainer walking away a release-day
# outage) but it is the behaviour that shipped, and loosening it is a policy
# decision, not a refactor.
#
# Reasons and [review-by] dates live in deny.toml. The short notes below are
# only there to make this file readable on its own.

[advisories]
ignore = [
    # ── Real vulnerability ────────────────────────────────────────────
    # rsa 0.9 Marvin Attack timing sidechannel. NOTE: `rsa` is no longer in
    # Cargo.lock at all, so this suppression is currently inert — kept
    # because dropping it in the same change that consolidated the lists
    # would have been a silent policy change. Remove at the next triage if
    # it is still absent.
    "RUSTSEC-2023-0071",

    # ── Tauri 2.x Linux stack (gtk-rs GTK3 family) ────────────────────
    # Ten transitives via tauri → tray-icon / muda / tao / webkit2gtk / wry.
    # Gated on Tauri's gtk4 migration.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # glib 0.18.5 unsound `VariantStrIter` — same gtk4 gate.
    "RUSTSEC-2024-0429",

    # ── ratatui 0.29 (TUI layout cache) ───────────────────────────────
    # lru 0.12.5 `IterMut` Stacked-Borrows unsoundness. Gated on the
    # ratatui 0.29 → 0.30 upgrade.
    "RUSTSEC-2026-0002",

    # ── unic-* family ─────────────────────────────────────────────────
    # One upstream Unicode chain, five advisories. Replacement is icu4x.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",

    # ── Common transitive unmaintained crates ─────────────────────────
    # `serial`.
    "RUSTSEC-2017-0008",
    # yaml-rust. NOTE: also no longer in Cargo.lock — see the rsa note above.
    "RUSTSEC-2024-0320",
    # proc-macro-error 1.x.
    "RUSTSEC-2024-0370",
    # instant.
    "RUSTSEC-2024-0384",
    # derivative (via keyring → secret-service → zbus 3.x).
    "RUSTSEC-2024-0388",
    # paste.
    "RUSTSEC-2024-0436",
    # fxhash (via mistralrs-core → bm25 2.3.2).
    "RUSTSEC-2025-0057",
    # number_prefix.
    "RUSTSEC-2025-0119",
    # rustls-pemfile, superseded by rustls-pki-types.
    "RUSTSEC-2025-0134",
    # bincode 1.x (via syntect 5.3 and vibe-memory).
    "RUSTSEC-2025-0141",
    # smallstr (via yrs 0.27, the CRDT layer behind vibe-collab).
    "RUSTSEC-2026-0215",
]
