name: vibecody_mobile
description: VibeCody Mobile — Remote management of VibeCody CLI/UI sessions.
publish_to: 'none'
version: 0.5.12+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.0.0
  mobile_scanner: ^7.4.0
  multicast_dns: ^0.3.2+1
  speech_to_text: ^7.4.0
  record: ^7.1.1
  permission_handler: ^13.0.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
