[package]
name = "vibe-desktop-settings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Settings Tauri commands shared by the VibeCody desktop shells (VibeDesk, VibeAIChat)."

[dependencies]
tauri = { version = "2" }
serde_json = { workspace = true }
# Only the store, not the CLI. Depending on `vibecli` here pulled the whole
# inference stack into every shell that renders a settings screen —
# including VibeAIChat, which documents that it avoids exactly that.
vibe-profile-store = { path = "../vibe-profile-store" }
