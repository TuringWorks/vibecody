[package]
name = "vibe-daemon-token"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Where the VibeCLI daemon's bearer token lives, and whether the one you hold is the one the live daemon minted."

# Deliberately tiny. Every client that authenticates against the daemon depends
# on this — including `vibe-eval` and `vibe-desktop-voice`, which are leaves with
# no internal dependencies at all and cannot reach `vibecli-cli`. Anything
# heavier here would be pulled into all of them.
[dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
dirs = "6.0"

[dev-dependencies]
tempfile = "3"
