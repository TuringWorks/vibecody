[package]
name = "vibe-coder"
version.workspace = true
description = "VibeCoder - AI-Powered Code Editor"
authors.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vibe_coder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["devtools"]
devtools = ["tauri/devtools"]
# Embeds the built frontend in the binary. Without it `generate_context!` stores
# no assets and the window is pointed at `devUrl` instead, so the app opens on a
# blank white page with nothing on stdout, in the log, or on screen to say why.
#
# `tauri build` turns this on for you — it passes `--features
# tauri/custom-protocol` — which is why every shipped build is fine and only a
# bare `cargo build --release` is not. Deliberately **not** in `default`:
# embedding brotli-compresses the whole bundle during macro expansion, and with
# it on by default every `cargo check` of this crate would pay for that.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# One shared reqwest::Client per timeout. The session pollers ran on a 2s
# interval and built a fresh Client each time, so every poll paid a new
# handshake to a daemon on localhost.
vibe-http-pool = { path = "../../crates/vibe-http-pool" }
vibe-embed = { path = "../../crates/vibe-embed" }
# Console-window-free child processes on Windows. Shared with vibe-core /
# vibe-ai / vibe-lsp so there is one implementation and one policy.
vibe-no-window = { path = "../../crates/vibe-no-window", features = ["tokio"] }
# DOCX / EPUB / Pages: read them as text and write the edits back in place.
vibe-docfmt = { path = "../../crates/vibe-docfmt" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9.34"
tokio.workspace = true
anyhow.workspace = true
lsp-types.workspace = true
walkdir.workspace = true
regex.workspace = true
reqwest.workspace = true
url.workspace = true
rand = "0.10"
dirs = "6"
futures = "0.3"
axum.workspace = true

# Local crates
vibe-core = { path = "../crates/vibe-core" }
vibe-lsp = { path = "../crates/vibe-lsp" }
vibe-ai = { path = "../crates/vibe-ai" }
vibe-extensions = { path = "../crates/vibe-extensions" }
vibe-collab = { path = "../crates/vibe-collab" }
vibe-memory = { path = "../../vibe-memory" }
vibecli_cli = { package = "vibecli", path = "../../vibecli/vibecli-cli" }
# Voice input — the same daemon bridge VibeDesk and VibeAIChat use.
vibe-desktop-voice = { path = "../../crates/vibe-desktop-voice" }
# The daemon's token layout and the "is mine the live one" check. Shared so a
# shell cannot disagree with the daemon about where the credential lives.
vibe-daemon-token = { path = "../../crates/vibe-daemon-token" }
base64 = "0.23.1"
chrono = "0.4.44"
rusqlite = { version = "0.40", features = ["bundled"] }
chacha20poly1305 = "0.11"
hostname = "0.4"
sha2 = "0.10"
sysinfo = "0.39"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# `MockAIProvider` lives behind this feature. The chat path's reasoning-only
# continuation is tested against it — a scripted provider is the only way to
# assert "asked once more, kept the answer" without a live model.
vibe-ai = { path = "../crates/vibe-ai", features = ["testing"] }

