[package]
name = "vibe-extensions"
version.workspace = true
description = "WASM extension system for VibeCody"
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# WASM runtime for extensions.
# Pinned >=47.0.3: RUSTSEC-2026-0222 (stores can mix up type indices between
# engines) is unpatched in the 45.x line.
wasmtime = "48.0.0"

# Home directory resolution
dirs-next = "2.0"

[dev-dependencies]
wat = "1"
