[package]
name = "vibe-core"
version.workspace = true
description = "Core text buffer, filesystem, git, search, and workspace primitives for VibeCody"
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# Git integration
git2.workspace = true

# File watching
notify = "8.2"

# Search
walkdir = "2"
regex = "1"

# Terminal
portable-pty = "0.9"

# Diff
similar = { version = "3.1", features = ["inline"] }

# Crypto-safe random (temp file names, etc.)
rand = "0.10"

# HTTP (for embedding API calls)
reqwest.workspace = true

# Provider-agnostic embedding layer (Ollama / OpenAI / Voyage / Cohere / Gemini / local)
vibe-embed = { path = "../../../crates/vibe-embed" }
async-trait.workspace = true

# Archive browsing (read-only) + extract-to-edit. `zip` is the same major the
# docfmt container helpers use; `lzma-rs` is pure Rust and decompress-only,
# which is all the xz path needs and avoids vendoring liblzma's C source.
zip = "8"
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
zstd = "0.13"
lzma-rs = "0.3"

# SQLite — for sonar_rules local rule store. Same workspace dep used
# by the daemon's session/workspace stores.
rusqlite.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
cucumber = { version = "0.23", features = ["macros"] }
criterion = { version = "0.8", features = ["html_reports"] }

[[test]]
name = "git_checkpoint_bdd"
path = "tests/git_checkpoint_bdd.rs"
harness = false

[[bench]]
name = "index_bench"
harness = false
