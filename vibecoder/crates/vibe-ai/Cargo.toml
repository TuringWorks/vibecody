[package]
name = "vibe-ai"
version.workspace = true
description = "AI provider abstraction layer with 18 providers for VibeCody"
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# The daemon token layout, shared with the daemon itself so the
# `vibecli-mistralrs` provider cannot disagree with it about where the
# credential lives.
vibe-daemon-token = { path = "../../../crates/vibe-daemon-token" }
# Shared embedding-model catalog — keeps the chat-model filter and the
# embedding-model picker reading one classifier.
vibe-embed = { path = "../../../crates/vibe-embed" }
# Child processes that do not pop a console window on Windows.
vibe-no-window = { path = "../../../crates/vibe-no-window", features = ["tokio"] }
# PATH resolution and the POSIX shell. `npm`/`npx` are `.cmd` shims on
# Windows and a bare name resolves to nothing there; `vibe_core::which`
# finds the real file, and `vibe_core::shell` is the one place that knows
# where `sh` lives.
vibe-core = { path = "../vibe-core" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
reqwest.workspace = true
tracing.workspace = true

# Streaming support
futures = "0.3"
tokio-stream = "0.1"

# Environment variables
dotenvy = "0.15"

# Configuration
toml = "0.8"

# Tool call parsing
regex.workspace = true

# File walking for rules loader
walkdir.workspace = true

# AWS SigV4 signing (Bedrock)
sha2.workspace = true
hmac.workspace = true
hex.workspace = true

[features]
testing = []

[dev-dependencies]
tempfile = "3"
# Measures the streaming parser's per-chunk allocation cost. See
# tests/tool_parse_allocations.rs.
vibe-alloc-count = { path = "../../../crates/vibe-alloc-count" }
cucumber = { version = "0.23", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[[test]]
name = "rules_matching_bdd"
path = "tests/rules_matching_bdd.rs"
harness = false

[[test]]
name = "agent_spawn_bdd"
path = "tests/agent_spawn_bdd.rs"
harness = false

[[test]]
name = "circuit_breaker_bdd"
path = "tests/circuit_breaker_bdd.rs"
harness = false

[[test]]
name = "failover_bdd"
path = "tests/failover_bdd.rs"
harness = false

[[test]]
name = "mock_provider_bdd"
path = "tests/mock_provider_bdd.rs"
harness = false
required-features = ["testing"]

[[test]]
name = "tool_parse_allocations"
path = "tests/tool_parse_allocations.rs"
